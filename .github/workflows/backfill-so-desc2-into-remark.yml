name: Carry AutoCount Description 2 into the SO line remark

# Manual. Owner 2026-09-08: 「记得把autocount的这个description2 remain着搬进去
# 我们的remark」.
#
# PLAN is the default and it is READ-ONLY: it counts the migrated company-1
# sales-order lines whose book Description 2 is missing from the remark, and
# uploads the plan as an artifact. Commit that plan, then run APPLY, which
# refuses unless re-planning against the live rows reproduces the committed
# plan's digest — a plan built before another lane rewrote these remarks is
# stale and must not be applied.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "staging"
        type: choice
        options: [staging, prod]
      mode:
        description: "plan = read-only + upload the plan; apply = write the COMMITTED plan"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]
      company:
        description: "Company id (1 = Houzs Century)"
        required: false
        default: "1"
        type: string

# Its own group: a diagnostic must never queue behind, or displace, a release —
# and must never cancel another lane's run.
concurrency:
  group: backfill-so-desc2-into-remark-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'staging' && 'Staging' || '' }}
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci

      - name: Carry Description 2 into the remark
        run: node scripts/backfill-so-desc2-into-remark.mjs
        env:
          MODE: ${{ inputs.mode }}
          # The phrase is required by the script on the apply path; supplying it
          # here is what makes "apply" in the dropdown mean apply.
          CONFIRM: ${{ inputs.mode == 'apply' && 'CARRY AC DESC2 INTO REMARK' || '' }}
          COMPANY_ID: ${{ inputs.company }}
          DATABASE_URL: ${{ inputs.target == 'staging' && secrets.STAGING_DATABASE_URL || secrets.DATABASE_URL }}

      - name: Upload the plan
        if: ${{ inputs.mode == 'plan' }}
        uses: actions/upload-artifact@v4
        with:
          name: desc2-remark-plan-${{ inputs.target }}
          path: backend/scripts/data/desc2-remark-plan.json
          if-no-files-found: error
