name: Where did a differing sales order come from? (read-only)

# The sales-order tally names a document and an axis. It does not print the two
# values, and it never says WHO RAISED the document — so on 2026-09-09 the
# nineteen were being adjudicated from names alone, and the brief for that work
# named two documents (`HC-SO-009735`, `HC-SO-011657`) that had already left the
# list by the time it ran.
#
# This prints, per document: the book's lines and Desc2, the ERP's lines and
# variants, and the provenance test — a MIGRATED order carries the book's number
# (`SO-013503`) beside its own (`HC-SO-013503`) and the two are never equal,
# while an order the ERP RAISED after go-live reaches the account book only
# through our own write-back and therefore carries its own number on BOTH sides.
#
# IT RECLASSIFIES NOTHING. The tally still counts every document it prints.
#
# READ-ONLY: SELECTs only, one connection, no DDL, no transaction, no MODE=apply,
# and every read is bounded by the documents named in `docs`.
on:
  workflow_dispatch:
    inputs:
      docs:
        description: "Comma-separated ERP document numbers (HC-SO-010284,HC-SO-2609-002)"
        required: true
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
      max_snapshot_age_days:
        description: "Refuse if the AutoCount snapshot is older than this many days"
        required: false
        default: "2"

# Its OWN group, never the deploy's: a diagnostic must not queue behind — or
# displace — a release.
concurrency:
  group: probe-so-differ-provenance
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Both sides, and where the document came from
        run: node scripts/probe-so-differ-provenance.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOCS: ${{ inputs.docs }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first
