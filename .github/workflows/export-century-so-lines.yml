name: Export Century SO lines (read-only)

# Manual, read-only. Dumps every SOFA + BEDFRAME sales-order line for one
# company (default 1 = HOUZS / Houzs Century), all statuses, as a JSON artifact
# so the owner gets the whole corpus instead of the ERP's one-page export.
# SELECT only -- no writes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      company_id:
        description: "company_id (1 = HOUZS / Houzs Century)"
        required: true
        default: "1"
        type: string

jobs:
  export:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - name: Export sofa+bedframe SO lines
        env:
          DATABASE_URL: ${{ inputs.target == 'prod' && secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL missing"; exit 2; fi
          node scripts/export-century-so-lines.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: century-so-lines-${{ inputs.company_id }}-${{ inputs.target }}
          path: backend/out/century-so-lines.json
          if-no-files-found: error
          retention-days: 30
