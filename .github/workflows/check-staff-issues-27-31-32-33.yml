name: Check staff issues 27/31/32/33 (read-only)

# Staff issue list #27 (PO Chasing tab not visible), #31 (PO outstanding list
# only shows POs from 4/9), #32 (address request shown as an item amendment on
# HC-SO-009093 / HC-SO-004928), #33 (HC4681 SO vs DO line mismatch).
# Prints, per issue, the production rows that decide the answer — see the header
# of backend/scripts/check-staff-issues-27-31-32-33.mjs.
#
# READ-ONLY: SELECTs only, the session is set READ ONLY. Manual trigger only.
# Exits 0 on every legitimate answer; the answer is the log.

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company id (1 = HOUZS)"
        required: false
        default: "1"
      user_like:
        description: "Name fragment for #27 (users.name ILIKE %x%)"
        required: false
        default: "sim"
      split_date:
        description: "#31 po_date split"
        required: false
        default: "2026-09-04"
      amend_sos:
        description: "#32 sales orders, comma separated"
        required: false
        default: "HC-SO-009093,HC-SO-004928"
      doc_4681:
        description: "#33 document number suffix"
        required: false
        default: "4681"

concurrency:
  group: check-staff-issues-27-31-32-33
  cancel-in-progress: false

jobs:
  prod:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/check-staff-issues-27-31-32-33.mjs
        env:
          COMPANY: ${{ inputs.company }}
          USER_LIKE: ${{ inputs.user_like }}
          SPLIT_DATE: ${{ inputs.split_date }}
          AMEND_SOS: ${{ inputs.amend_sos }}
          DOC_4681: ${{ inputs.doc_4681 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
