name: Repair SO line discount (plan by default)

# AutoCount's sales-order lines carry a LINE DISCOUNT and the ERP stored
# qty x unit price undiscounted, so a migrated sales order overstates what the
# customer owes. HC-SO-000021 is the worked example: RM 10,852.00 held against
# the book's RM 9,876.00, and the RM 976.00 is three line discounts.
# The purchase-order twin is repair-po-line-discount.yml; the class is
# docs/bugs/0662, and the population rule is docs/bugs/0694.
#
# PLAN IS THE DEFAULT AND WRITES NOTHING. It prints, per document, the ERP total
# now, the AutoCount total, what the header would read after the repair, every
# line it would change and every line it REFUSES. Run it, read it, then decide.
#
# APPLY MOVES MONEY ON LIVE CUSTOMER ORDERS. It needs apply=yes AND the confirm
# phrase in full. It writes discount_sen + total_sen + total_inc_sen +
# balance_sen on the line and re-sums local_total_sen and the five category
# buckets on the header — the invariant the app's own SO routes maintain
# (mfg-sales-orders.ts:4251), because correcting the line amount alone is undone
# by the next person who edits that line in the UI.
#
# It does NOT touch unit_price_sen (AutoCount's own UnitPrice is the
# undiscounted figure), does NOT touch the header's paid_sen / balance_sen (what
# a customer paid is a fact, not an arithmetic consequence — an inconsistency is
# NAMED for the owner), and REFUSES a line whose goods have already been
# delivered.
#
# The AutoCount side is the committed snapshot
# backend/scripts/data/ac-reconcile-truth.json.gz, re-cut on the office network
# with  AC_CRED_FILE=<path> node backend/scripts/export-ac-reconcile-truth.mjs
# The script REFUSES a snapshot older than max_snapshot_age_days rather than
# moving money against a stale book.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      apply:
        description: "yes = WRITE. Anything else = PLAN only, which is the default."
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      confirm:
        description: 'Type I HAVE REVIEWED THE SO DISCOUNT PLAN to arm apply. Ignored when apply=no.'
        required: false
        default: ""
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
        type: string
      max_snapshot_age_days:
        description: "Refuse an AutoCount snapshot older than this many days."
        required: false
        default: "2"
        type: string

# Its own group, never the deploy's. Not cancel-in-progress — cancelling an
# APPLY mid-write is the one thing worse than waiting.
concurrency:
  group: repair-so-line-discount-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    environment: Production
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/repair-so-line-discount.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/repair-so-line-discount.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
