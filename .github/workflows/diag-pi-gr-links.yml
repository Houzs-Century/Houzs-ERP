name: Purchase invoices — why they differ on the transfer chain (READ-ONLY)

# Runs 34268495385 / 34263816266 on `main`: PURCHASE INVOICES 53 differ, the
# largest number left before go-live. docs/bugs/0730 attributes 47 of them to
# two columns and predicts they fall out together. A previous lane made that
# prediction, measured, and found 53 -> 53.
#
# This writes NOTHING. It exists because the repair that follows has two
# candidate causes wanting OPPOSITE writes: stamping `linked_ac_gr_docno` onto
# a receipt that IS the book's receipt states a fact we hold, and stamping it
# onto an ERP-native receipt INVENTS a link. Section 3 of the script separates
# them per document rather than assuming.
#
# The ERP side lives only in production, so it runs here over
# secrets.DATABASE_URL rather than putting the production DSN in front of a
# person. Manual trigger only — it is a question, not a gate.
on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
      max_snapshot_age_days:
        description: "Refuse if the chain snapshot is older than this"
        required: false
        default: "2"
      show:
        description: "Rows to print per section"
        required: false
        default: "40"

# Its own group: this reads and must neither queue behind a release nor
# displace one.
concurrency:
  group: diag-pi-gr-links
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Explain the purchase-invoice differences (writes nothing)
        run: node scripts/diag-pi-gr-links.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          SHOW: ${{ inputs.show }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first
