name: Why the sales orders differ on 单据转换链 (read-only)

# 「我要知道是SO 几时可以好！！！！」 (the owner, 2026-09-08)
#
# The sales-order verdict of run 34254777347 carried 35 documents on the
# `transfer to` axis, every one of them on a PROCEEDED order, with no cause
# split. Two rows that look identical in that counter are owed opposite things:
# one is a stored number that lags its own purchase-order children, the other is
# the app's own rule DROPPING a purchase-order line on purpose (an MRP-origin
# line, a DRAFT order). A sweep over the mixed set overwrites the rows that were
# already right, which is why this exists BEFORE any repair.
#
# The AutoCount side is the committed snapshot
# backend/scripts/data/ac-convert-edges.json.gz — the book is reachable only
# over ZeroTier from the office network, which a GitHub-hosted runner has no
# route to. The checker REFUSES on a stale cut rather than answering against an
# old book.
#
# READ-ONLY: SELECTs only, one connection, no DDL, no writes, no transaction,
# and no MODE=apply. Manual trigger only — it is a question, not a gate, and a
# production DB read on a schedule becomes CI noise nobody reads.
on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
      max_snapshot_age_days:
        description: "Refuse if the AutoCount snapshot is older than this many days"
        required: false
        default: "2"
      show:
        description: "How many offending lines to name per cause"
        required: false
        default: "60"

# Its OWN group, never the deploy's: a diagnostic must not queue behind — or
# displace — a release.
concurrency:
  group: so-po-counter-causes
  cancel-in-progress: true

jobs:
  causes:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Split the counter differences by cause
        run: node scripts/check-so-po-counter-causes.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          SHOW: ${{ inputs.show }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first
