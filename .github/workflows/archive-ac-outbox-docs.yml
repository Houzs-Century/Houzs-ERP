name: Archive AutoCount outbox rows for named documents (DRY-RUN gated)

# Reusable: archive the outbox rows for a caller-supplied list of documents so
# they leave the AutoCount Sync "Not accepted" list. archived_at only — never
# DELETE, never touch status/last_error, reversible by clearing the column.
# Only the doc_nos you name are touched; it never sweeps by status or age.
#
# DRY-RUN by default. CONFIRM=ARCHIVE-THESE-AC-DOCS to write.

on:
  workflow_dispatch:
    inputs:
      doc_nos:
        description: 'Document numbers to archive, comma or space separated'
        required: true
        type: string
      company_id:
        description: 'Company id (1 = HOUZS / Houzs Century)'
        required: false
        default: '1'
        type: string
      apply:
        description: '1 to write, anything else DRY-RUN'
        required: false
        default: '0'
        type: string
      confirm:
        description: 'For apply ONLY, type exactly: ARCHIVE-THESE-AC-DOCS'
        required: false
        default: ''
        type: string

concurrency:
  group: archive-ac-outbox-docs
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/archive-ac-outbox-docs.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOC_NOS: ${{ inputs.doc_nos }}
          COMPANY_ID: ${{ inputs.company_id }}
          MODE: ${{ inputs.apply == '1' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          NODE_OPTIONS: --dns-result-order=ipv4first
