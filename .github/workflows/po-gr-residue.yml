name: What is still open on PO and GR (read-only)

# The companion to `po-gr-tally-verdict.yml`. That one answers 「都tally了吗」
# with counts and document numbers; this one answers the question that always
# comes next — what is actually wrong with each of the ones still open.
#
# WHY IT IS A SEPARATE WORKFLOW. The same answer exists inside the reconcile's
# own transfer-chain block, and it is UNREADABLE in practice: that block is
# captured as a subprocess's stdout and printed at the very end of a 1,300-line
# log, and GitHub truncates the step's log before reaching it. Measured on runs
# 34255914713 and 34258038309 — cut off both times. So the facts were being
# computed and thrown away.
#
# READ-ONLY. SELECTs only, one connection, no DDL, no transaction, no MODE and
# no apply path. It repairs nothing: a transfer-quantity correction moves an
# on-hand figure and stock is DEFERRED by the owner (「库存先不看」).
#
# Manual trigger only — it is a question, not a gate.
on:
  workflow_dispatch:
    inputs:
      show:
        description: "Documents to name per section"
        required: false
        default: "40"
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"

# Its OWN group, and not the tally's: asking this must not cancel a tally
# somebody else is waiting on.
concurrency:
  group: po-gr-residue
  cancel-in-progress: true

jobs:
  residue:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: What is still open
        run: node scripts/check-po-gr-residue.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SHOW: ${{ inputs.show }}
          COMPANY_ID: ${{ inputs.company_id }}
          NODE_OPTIONS: --dns-result-order=ipv4first
