name: A purchase invoice line, its receipt line, and the book's (read-only)

# The purchase-invoice tally locks 20 documents on `transfer from` and 8 more on
# the specification axes. Both name a value and stop there, and both have the
# same candidate explanation that nobody had measured: a migrated invoice line
# is a COPY of a goods-receipt line, so a blank on the invoice is a blank on the
# receipt, and a link the book cannot confirm is a receipt LINE the cutover
# never carried.
#
# This prints all three sides — our invoice line, the receipt line it was built
# from, and the book's own source line — and DECIDES NOTHING. There is no
# MODE=apply and the connection is opened with
# `default_transaction_read_only`, so the SERVER refuses a write rather than the
# script merely promising not to make one.
#
# Manual trigger only: it is a question, not a gate.
on:
  workflow_dispatch:
    inputs:
      pi_docs:
        description: "AutoCount purchase invoices, comma separated (required)"
        required: true
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
      max_snapshot_age_days:
        description: "Refuse if an AutoCount snapshot is older than this many days"
        required: false
        default: "2"

# Its OWN group, and it does NOT cancel in progress: several lanes are reading
# this book at once and asking a question must never cancel somebody else's
# answer, nor queue behind or displace a release.
concurrency:
  group: diag-pi-line-provenance
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: All three sides, line by line
        run: node scripts/diag-pi-line-provenance.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          PI_DOCS: ${{ inputs.pi_docs }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first
