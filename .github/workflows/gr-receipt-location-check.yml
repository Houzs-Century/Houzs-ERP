name: GR receiving location check (read-only)

# The owner's question, 2026-09-08: he reads the receiving location on every
# goods receipt and asked whether the migrated ones carry AutoCount's.
#
# They do not COPY it — both writers DERIVE it from the purchase order
# (create-migrated-documents.mjs, reshape-migrated-grns.mjs). This job measures
# what that derivation actually produced in production, whether it agrees with
# AutoCount's own GRDTL location where the committed cuts carry it, and — the
# blocker question — whether changing a migrated receipt's warehouse could move
# stock and so break the 2026-09-07 23:55+08 re-seed.
#
# The answer lives only in production, so this runs here rather than putting the
# production DSN in front of a human for a SELECT (repo rule: build the check,
# never ask the owner to run a query). Strictly read-only — SELECT only, no DDL,
# no writes, no transaction. See backend/scripts/check-gr-receipt-location.mjs.
#
# Manual trigger only — it is a question, not a gate, and a production DB read
# must never become routine CI noise.
on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "Company to report on (1 = Houzs Century)"
        required: false
        default: "1"

# Own concurrency group — touches nothing, must never queue behind or displace a
# release (and must not share the deploy's group).
concurrency:
  group: gr-receipt-location-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-gr-receipt-location.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          # GitHub-hosted runners have no IPv6 egress; match the deploy jobs and
          # the sibling read-only checks.
          NODE_OPTIONS: --dns-result-order=ipv4first
