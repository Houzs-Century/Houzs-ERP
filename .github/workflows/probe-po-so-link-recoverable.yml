name: PO -> SO link — how much does the book provably recover? (read-only)

# Section 5 of the convert-symmetry check found document edges AutoCount records
# and the ERP does not hold, all on SO->PO — the one edge the book keys at LINE
# level. 4a separately reports purchase-order lines carrying no sales-order link.
# A NULL there is not automatically a defect: a purchase order raised on its own
# has no sales order. Only the book can say which NULLs should have been links.
#
# This probe counts the ones it PROVABLY resolves and, separately, each way a row
# fails to be provable — no book row, no source recorded in the book, an
# ambiguous AutoCount line key (a sofa is one book line and several ERP rows),
# and the two ends naming different products, which is the bug class that put
# nine sales-order lines on the wrong bed on 2026-09-07.
#
# READ-ONLY: SELECTs only, no DDL, no writes, no transaction. Manual trigger,
# own concurrency group, exit 0 for every legitimate answer — non-zero only when
# the answer cannot be trusted (missing or stale snapshot, classes that do not
# add up to the population).
on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "ERP company to check (AED_HOUZS is company 1)"
        required: false
        default: "1"
      max_snapshot_age_days:
        description: "Refuse if the AutoCount snapshot is older than this many days"
        required: false
        default: "2"

concurrency:
  group: probe-po-so-link-recoverable
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/probe-po-so-link-recoverable.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          NODE_OPTIONS: --dns-result-order=ipv4first
