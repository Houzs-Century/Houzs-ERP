name: Venue showroom parking check (read-only)

# Owner 2026-08-02: are the 2990 salespeople parked under a showroom? For every
# rep who writes a 2990 SO this shows their scm.staff.showroom_warehouse_id, that
# showroom's venue_name, and their venue fill rate — so an empty venue reads as
# either "backfillable (rep is parked)" or "by design (rep not parked)".
#
# Owner 2026-08-19: "我们的 Venue、我们的 Warehouse、我们的 Showroom 等等，都是跟
# 着看到自己公司的" — the second step measures the cross-company leak that
# ruling names: how many showroom venues each company's picker listed with no
# company predicate (BEFORE) vs with one (AFTER), and which rows were foreign.
#
# SELECT only — no writes. The verdict is the output.
on:
  workflow_dispatch:

concurrency:
  group: venue-showroom-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-venue-showroom-parking.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Company scope of the venue/showroom masters — BEFORE/AFTER counts per
      # company for GET /api/projects/venues?includeShowrooms=1.
      - run: node scripts/check-showroom-venue-scope.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first
