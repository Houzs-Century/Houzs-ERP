name: Backfill AutoCount line keys (goods receipts + delivery orders + invoices)

# Manual. Stamps linked_ac_dtlkey on scm.grn_items, scm.delivery_order_items,
# scm.sales_invoice_items and scm.purchase_invoice_items from the account book's
# own export, so the reconcile stops GUESSING which of our rows answers which of
# the book's and the write-back can name the line an operator changed.
#
# The two INVOICE lanes were added 2026-09-09. Before them the transfer-chain
# audit could not ask a sales or purchase invoice anything at all — every line
# reached it with no book line number — so that axis printed "not measured" for
# both types. The key is the whole of what was missing.
#
# Migration 0280 added the column and states "nothing backfills it". This is
# that backfill. It stamps only where the document FORCES the pairing — see
# backend/scripts/lib/ac-forced-line-pairing.mjs — and refuses the rest by name.
#
# DRY-RUN by default; apply=1 writes. Read the refusals in the dry-run first:
# this writes LINE IDENTITY, and a wrong DtlKey makes AcSyncService append a
# line to the LIVE account book instead of editing the one that changed.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      apply:
        description: "1 to write, else DRY-RUN"
        required: false
        default: "0"
        type: string
      confirm:
        description: 'For apply ONLY, type exactly: STAMP DOWNSTREAM LINE KEYS'
        required: false
        default: ""
        type: string

# Its OWN group, never the deploy's: a cutover write must not queue behind — or
# displace — a release.
concurrency:
  group: backfill-ac-downstream-line-keys-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/backfill-ac-downstream-line-keys.mjs
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/backfill-ac-downstream-line-keys.mjs
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
