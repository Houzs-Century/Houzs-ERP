name: Deploy POS

# Houzs POS (pos/) — the cash & carry booth app, a static SPA on its own
# Cloudflare Pages project `houzs-pos` (custom domain pos.houzscentury.com).
# Its own workflow, not a job in deploy.yml: a failure here (the Pages project
# not created yet, a token scope) must never read as a failed ERP release.
#
# ONE-TIME SETUP before the first run succeeds: create the Pages project
# `houzs-pos` in the Cloudflare account (Workers & Pages > Create > Pages >
# direct upload), then add the custom domain pos.houzscentury.com to it. The
# same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as the ERP deploy
# are reused; the token already carries Pages edit on this account.

on:
  push:
    branches: [main]
    paths:
      - "pos/**"
      - "frontend/src/vendor/shared/**"
      - ".github/workflows/deploy-pos.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pos:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The service worker carries this build's precache list
        run: |
          grep -q '"/assets/' dist/sw.js
          ! grep -q '__SW_' dist/sw.js
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pos
          command: pages deploy ./dist --project-name=houzs-pos --commit-dirty=true
