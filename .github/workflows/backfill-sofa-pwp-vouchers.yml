name: Backfill sofa PWP vouchers (cutover gap)

# Re-issues the SOFA 换购 vouchers that were never minted between the 2990
# cutover (2026-07-21) and the #1339 deploy — see
# backend/scripts/backfill-sofa-pwp-vouchers.mjs for the scope + safety rules.
#
# DRY-RUN is the default and prints the whole plan. Flip mode=apply only after
# reading a dry-run. The script is idempotent (tops up to the rule's target,
# never re-issues), so a re-run after a partial failure is safe.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      mode:
        description: "dry-run prints the plan; apply WRITES vouchers"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
      since:
        description: "Cutover date (YYYY-MM-DD) — SOs on/after this date"
        required: false
        default: "2026-07-21"
        type: string

# Never queue behind — or displace — a release.
concurrency:
  group: backfill-sofa-pwp-vouchers
  cancel-in-progress: false

jobs:
  backfill-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/backfill-sofa-pwp-vouchers.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          APPLY: ${{ inputs.mode == 'apply' && '1' || '0' }}
          SINCE: ${{ inputs.since }}
          NODE_OPTIONS: --dns-result-order=ipv4first

  backfill-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/backfill-sofa-pwp-vouchers.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.mode == 'apply' && '1' || '0' }}
          SINCE: ${{ inputs.since }}
          NODE_OPTIONS: --dns-result-order=ipv4first
