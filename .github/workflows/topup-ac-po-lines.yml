name: Top up missing AutoCount PO lines (line level)

# Manual. Both PO importers are idempotent at DOCUMENT level, so a purchase
# order that already existed was skipped WHOLE and any line the earlier run did
# not carry was never written - 26 sofa lines riding 25 MIXED documents, which
# re-running the importer can never fix ("already imported: 160; to insert: 0").
# This diffs the AutoCount exports against scm.purchase_order_items LINE BY LINE
# and inserts only what is missing. It never creates a document, never changes a
# status, and never posts an inventory movement. DRY-RUN by default; apply=1
# writes, and only together with confirm="I HAVE REVIEWED THE DRY-RUN" — the
# script exits 2 on apply without it, so the phrase is not optional in practice.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      apply:
        description: "1 to write, else DRY-RUN"
        required: false
        default: "0"
        type: string
      doc:
        description: "Optional single AutoCount PO number, e.g. PO-009435"
        required: false
        default: ""
        type: string
      confirm:
        description: "For apply=1, type: I HAVE REVIEWED THE DRY-RUN"
        required: false
        default: ""
        type: string

concurrency:
  group: topup-ac-po-lines-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/topup-ac-po-lines.mjs
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
          DOC: ${{ inputs.doc }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/topup-ac-po-lines.mjs
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
          DOC: ${{ inputs.doc }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
