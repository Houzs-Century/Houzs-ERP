name: AutoCount parity check (read-only)

# Manual. Reconciles the ERP against the AutoCount snapshot on the three things
# that must agree before the floor switches over: PO->SO dedication, stock
# STATUS (incl. any fully-received dedication that is still not READY), and
# stock BALANCE per item. SELECT only, no writes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]

concurrency:
  group: check-autocount-parity-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-autocount-parity.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-autocount-parity.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # TEMPORARY, this branch only — reverted in the next commit. A
      # workflow_dispatch workflow is only registered from the DEFAULT branch,
      # so check-status-disagreement-why.yml cannot be dispatched until it
      # merges. Dispatching THIS already-registered workflow against the branch
      # checks the branch out, which is how the new read-only check gets its
      # one prod observation before review.
      - run: npx tsx scripts/check-status-disagreement-why.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
