name: Align rebind unlinked SKUs

# Adds supplier_material_bindings for ERP products that have an existing AutoCount
# stock item but no binding yet, by copying an existing sibling binding for the
# same AutoCount code. Additive only. Dry-run default.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      mode:
        description: "dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, apply]

concurrency:
  group: align-rebind-unlinked
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - name: Rebind
        env:
          DATABASE_URL: ${{ inputs.target == 'prod' && secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL missing"; exit 2; fi
          node scripts/align-rebind-unlinked.mjs
