name: MRP snapshot check (read-only)

# Answers "is the */15 MRP auto-refresh actually running?" without anyone opening
# a SQL console. The freshness of scm.mrp_snapshots.computed_at lives only in
# production; Actions already holds secrets.DATABASE_URL for the deploy, so the
# check runs here and nobody handles the credential.
#
# Manual trigger only — it is a question, not a gate, and a production DB read
# must never become routine CI noise on a schedule.
on:
  workflow_dispatch:

# Deliberately NOT in the deploy concurrency group: this touches nothing and must
# never queue behind (or displace) a release.
concurrency:
  group: mrp-snapshot-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-mrp-snapshot-freshness.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress (see deploy-staging.yml).
          NODE_OPTIONS: --dns-result-order=ipv4first
