name: Staging Refresh Data (prod -> staging, masked)

# Copies PRODUCTION data into the STAGING database so the staging rehearsal runs
# against real-shaped documents instead of an empty seed (owner, 2026-09-12:
# 「data 也是要部署过去」).
#
# Two jobs, two environments, on purpose:
#   dump     runs in `Production` and can see only DATABASE_URL (read-only pg_dump)
#   restore  runs in `Staging`    and can see only STAGING_DATABASE_URL
# Neither job holds both secrets, so a mis-scoped step cannot write prod. The
# dump crosses between them as a 1-day artifact.
#
# SAFETY BY CONSTRUCTION, not by configuration: every phone / mobile / email
# column in the copy is MASKED before the job ends (staff login emails kept so
# the E2E account still works). Even if a messaging secret is ever set on the
# staging Worker, no real customer is reachable from staging data.
#
# CREDENTIALS NEVER CROSS (always on, no input turns it off): sessions, reset /
# invite / share tokens, push device tokens, queued email, every password hash,
# TOTP secrets and POS PIN / terminal hashes are destroyed on staging, and IC /
# passport / bank / salary figures in HR + payroll are masked. A production
# password or session therefore opens nothing on staging. Testers sign in with
# the seeded staging account (staging-seed-account.mjs) and use Team -> "Login
# as member" (IMPERSONATION_ENABLED on staging) to act as anyone else. The last
# step FAILS the run if any production credential shape survives.
#
# Manual trigger only. Own concurrency group — never queues behind a deploy.
# RE-RUN: idempotent — every run truncates staging and reloads from the dump.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REFRESH-STAGING to confirm (staging data will be replaced)'
        required: true
        type: string
      mask_pii:
        description: 'Mask customer phone / email after restore (leave ON)'
        required: false
        default: true
        type: boolean

concurrency:
  group: staging-refresh-data
  cancel-in-progress: false

jobs:
  dump:
    name: Dump production data (read-only)
    if: ${{ inputs.confirm == 'REFRESH-STAGING' }}
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Assert the source is PRODUCTION
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # Production is project anogrigyjbduyzclzjgn (CLAUDE.md, "The Supabase MCP
          # lists THREE projects"). Refuse anything else rather than dump the wrong book.
          case "$DATABASE_URL" in
            *anogrigyjbduyzclzjgn*) echo "source: production (anogrigyjbduyzclzjgn)";;
            *) echo "::error::DATABASE_URL is not the production project — refusing to dump"; exit 1;;
          esac

      - name: pg_dump public + scm (data only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          # Data only: staging already carries the schema (staging-migrate.yml keeps
          # it current). The migration tracker is excluded so staging keeps its own
          # applied-list. Plain SQL so the restore can prepend one session setting.
          "$PG_DUMP" "$DATABASE_URL" \
            --data-only --no-owner --no-privileges \
            --schema=public --schema=scm \
            --exclude-table-data='public._pg_migrations' \
            --format=plain --file=prod-data.sql
          ls -la prod-data.sql
          echo "rows of COPY blocks: $(grep -c '^COPY ' prod-data.sql)"
          gzip -1 prod-data.sql

      # The OPERATIONAL SWITCHES, captured beside the data (docs/bugs/0840).
      # scm.app_config rows decide whether a document may be written at all
      # (scm.write_freeze, scm.migrated_so_lock). A staging copy that carries
      # production's ROWS but not production's SWITCHES answers "can staff save
      # this?" with the wrong answer — which is exactly what happened on
      # 2026-09-12: production had migrated orders locked, staging did not, so a
      # staging walk-through could not reproduce the refusal staff were hitting.
      # Captured as key=value text, never as a dump fragment, so the restore side
      # can print the before/after instead of silently applying it.
      - name: Capture production's operational switches
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F= -c "
            select key, value from scm.app_config
             where key in ('scm.write_freeze','scm.migrated_so_lock')
             order by key" > prod-switches.txt
          echo "production switches:"; sed 's/^/  /' prod-switches.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prod-data
          path: |
            prod-data.sql.gz
            prod-switches.txt
          retention-days: 1
          if-no-files-found: error

  restore:
    name: Restore into staging + mask
    needs: dump
    runs-on: ubuntu-latest
    environment: Staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/psql --version

      - name: Assert the target is STAGING
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          case "$DATABASE_URL" in
            *anogrigyjbduyzclzjgn*) echo "::error::STAGING_DATABASE_URL points at PRODUCTION — refusing"; exit 1;;
          esac
          case "$DATABASE_URL" in
            *minnapsemfzjmtvnnvdd*) echo "target: staging (minnapsemfzjmtvnnvdd)";;
            *) echo "::error::STAGING_DATABASE_URL is not the staging project — refusing"; exit 1;;
          esac

      - uses: actions/download-artifact@v4
        with:
          name: prod-data
          path: backend/

      - name: Row counts BEFORE (staging)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "
            select 'before ' || t || ': ' || n from (
              select 'scm.mfg_sales_orders' t, count(*) n from scm.mfg_sales_orders union all
              select 'scm.purchase_orders',   count(*) from scm.purchase_orders   union all
              select 'scm.grns',              count(*) from scm.grns              union all
              select 'scm.delivery_orders',   count(*) from scm.delivery_orders   union all
              select 'scm.purchase_invoices', count(*) from scm.purchase_invoices union all
              select 'scm.sales_invoices',    count(*) from scm.sales_invoices
            ) x;"

      - name: Truncate staging tables (public + scm, keep _pg_migrations)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          -- Business guards (e.g. scm.pos_sofa_combos_guard: "2990 POS combos are never
          -- deleted") forbid TRUNCATE on purpose in production. Emptying staging before a
          -- reload is not that act, so this session runs as a replica: no user trigger
          -- fires. The restore step already does the same.
          set session_replication_role = replica;
          do $$
          declare stmt text;
          begin
            select 'truncate table ' || string_agg(format('%I.%I', table_schema, table_name), ', ') || ' cascade'
              into stmt
              from information_schema.tables
             where table_schema in ('public','scm')
               and table_type = 'BASE TABLE'
               and table_name <> '_pg_migrations';
            raise notice 'truncating % tables', (select count(*) from information_schema.tables
               where table_schema in ('public','scm') and table_type='BASE TABLE' and table_name <> '_pg_migrations');
            execute stmt;
          end $$;
          SQL

      - name: Restore data
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          gunzip -f prod-data.sql.gz
          # Production carries tables that no migration created and staging does
          # not have (first run 34628200896 died on `public.ac_snapshot_purchase_orders`
          # after truncating staging — docs/bugs/0824). A COPY into a table that is
          # not there is not an error worth aborting a full reload for: drop those
          # blocks, SAY which, and keep ON_ERROR_STOP for every other statement so a
          # real failure still stops the load instead of half-loading.
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "
            select table_schema || '.' || table_name from information_schema.tables
             where table_schema in ('public','scm') and table_type = 'BASE TABLE'" > staging-tables.txt
          echo "staging has $(wc -l < staging-tables.txt) base tables"
          node - <<'JS'
            const fs = require('fs');
            const have = new Set(fs.readFileSync('staging-tables.txt', 'utf8').split('\n').map((s) => s.trim()).filter(Boolean));
            const src = fs.readFileSync('prod-data.sql', 'utf8').split('\n');
            const out = []; const skipped = new Set(); let kept = 0; let setvals = 0;
            let skipping = false;
            for (const line of src) {
              const m = /^COPY\s+("?[a-z0-9_]+"?)\.("?[a-z0-9_]+"?)\s/i.exec(line);
              if (m) {
                const key = `${m[1].replace(/"/g, '')}.${m[2].replace(/"/g, '')}`;
                skipping = !have.has(key);
                if (skipping) skipped.add(key); else kept++;
              }
              // pg_dump appends `SELECT pg_catalog.setval('<seq>', n, true);` for every
              // serial, including those of the tables skipped above — run 34630978074
              // died on `public.ac_snapshot_runs_id_seq does not exist` after every
              // COPY had already landed. The next step recomputes every serial from
              // max(id) anyway, so no setval line from the dump is needed at all.
              if (/^SELECT\s+pg_catalog\.setval\(/i.test(line)) { setvals++; continue; }
              if (!skipping) out.push(line);
              if (skipping && line === '\\.') skipping = false; // end of the COPY block
            }
            fs.writeFileSync('prod-data.filtered.sql', out.join('\n'));
            console.log(`COPY blocks kept: ${kept}; skipped (table absent on staging): ${skipped.size}; setval lines dropped: ${setvals}`);
            for (const k of [...skipped].sort()) console.log(`  skipped ${k}`);
            fs.writeFileSync('skipped-tables.txt', [...skipped].sort().join('\n'));
          JS
          # One session: relax FK/trigger enforcement for the load, then restore in
          # the order pg_dump wrote it. If the role may not set replica mode this
          # fails LOUDLY on the first statement instead of half-loading.
          { echo "set session_replication_role = replica;"; cat prod-data.filtered.sql; } \
            | /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q
          echo "restore: done"
          if [ -s skipped-tables.txt ]; then
            { echo "Tables in the production dump that staging does not have (schema drift — no migration creates them):"; sed 's/^/- /' skipped-tables.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reset sequences to max(id)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          # docs/bugs/0532: a data load that leaves identity sequences behind their
          # tables makes the next insert die on duplicate key.
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          do $$
          declare r record; mx bigint;
          begin
            for r in
              select n.nspname as sch, c.relname as tbl, a.attname as col,
                     pg_get_serial_sequence(format('%I.%I', n.nspname, c.relname), a.attname) as seq
                from pg_attribute a
                join pg_class c on c.oid = a.attrelid
                join pg_namespace n on n.oid = c.relnamespace
               where n.nspname in ('public','scm') and c.relkind = 'r' and a.attnum > 0 and not a.attisdropped
                 and pg_get_serial_sequence(format('%I.%I', n.nspname, c.relname), a.attname) is not null
            loop
              execute format('select coalesce(max(%I),0) from %I.%I', r.col, r.sch, r.tbl) into mx;
              execute format('select setval(%L, greatest(%s,1), %s)', r.seq, mx, case when mx > 0 then 'true' else 'false' end);
            end loop;
          end $$;
          SQL
          echo "sequences: reset"

      - name: Mask customer phone / email
        if: ${{ inputs.mask_pii }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          # Every text column whose NAME says phone / mobile / email, in public + scm.
          # Staff login identity is kept: users / members / sales_reps email stays,
          # so STAGING_E2E_EMAIL and the seeded owner still sign in. Everything else
          # becomes a stable, non-dialable token (same input -> same token, so joins
          # by phone still line up inside staging).
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          do $$
          declare r record; n bigint; total bigint := 0;
          begin
            for r in
              select c.table_schema sch, c.table_name tbl, c.column_name col
                from information_schema.columns c
                join information_schema.tables t
                  on t.table_schema = c.table_schema and t.table_name = c.table_name
               where c.table_schema in ('public','scm')
                 -- information_schema.columns lists VIEW columns too; run 34632903129
                 -- died on `cannot update view "mfg_sales_orders_with_payment_totals"`.
                 -- Only base tables hold data to mask; a view reads the masked rows.
                 and t.table_type = 'BASE TABLE'
                 and c.data_type in ('text','character varying')
                 and (c.column_name ~* 'phone|mobile' or c.column_name ~* 'email')
                 and not (c.column_name ~* 'email' and c.table_name in ('users','members','sales_reps','user_companies','invitations'))
                 and c.column_name !~* '_at$|_status$|_muted$|_required$|_log$|_access$|template|alias'
                 and c.table_name <> '_pg_migrations'
            loop
              execute format(
                'update %I.%I set %I = %L || left(md5(%I), 8) where %I is not null and %I <> %L and %I not like %L',
                r.sch, r.tbl, r.col,
                case when r.col ~* 'email' then 'masked-' else '+60000' end,
                r.col, r.col, r.col, '', r.col,
                case when r.col ~* 'email' then 'masked-%' else '+60000%' end);
              get diagnostics n = row_count;
              total := total + n;
              if n > 0 then raise notice 'masked %.%.%: % rows', r.sch, r.tbl, r.col, n; end if;
            end loop;
            raise notice 'masked total: % values', total;
          end $$;
          SQL

      # Not behind `mask_pii`: a production credential on staging is never an
      # acceptable rehearsal input. Rows are DELETEd, not TRUNCATEd ... CASCADE,
      # so an unexpected foreign key fails loudly instead of emptying a
      # document table nobody meant to touch.
      - name: Scrub credentials, sessions and payroll identifiers
        id: scrub
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          # Everything a check below sees with created_at before this instant
          # came from the production copy.
          echo "started=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          -- Session-only helper (pg_temp: gone when psql exits, nothing left on
          -- staging). One made-up factor per employee id, 0.60-0.99 or
          -- 1.01-1.40: never exactly 1, so no salary comes through unchanged.
          create or replace function pg_temp.stg_pay_factor(emp bigint) returns numeric
            language sql immutable as $f$
              select case when m < 40 then 0.60 + m / 100.0 else 1.01 + (m - 40) / 100.0 end
                from (select abs(hashtext('emp:' || emp)) % 80 as m) x
            $f$;
          do $$
          declare
            t text; n bigint; cols text;
          begin
            -- 1. Live credentials and anything that could reach a real person:
            --    deleted outright. A rewritten token is still a row something
            --    may try to use; a deleted one is not.
            foreach t in array array[
              'public.sessions',                -- bearer tokens
              'public.password_resets',         -- reset links
              'public.invitations',             -- invite links
              'public.push_devices',            -- iOS push tokens of real phones
              'public.share_export_log',        -- log keyed by share token
              'public.contractor_share_tokens', -- public calendar links
              'public.brand_share_tokens',      -- public calendar links
              'public.email_outbox'             -- real customer mail, queued or sent
            ] loop
              if to_regclass(t) is null then raise notice 'absent %', t; continue; end if;
              execute format('delete from %s', t);
              get diagnostics n = row_count;
              raise notice 'deleted %: % rows', t, n;
            end loop;

            -- 2. Passwords + two-step. A stored value with no '$' can never
            --    verify (services/auth.ts verifyPassword), so no production
            --    password matches any staging user. NULL stays NULL: that is
            --    the "invited, no password yet" state. The seed step below
            --    gives the staging test account its known password again.
            update public.users set password_hash = 'staging-scrubbed'
             where password_hash is not null and password_hash <> 'staging-scrubbed';
            get diagnostics n = row_count; raise notice 'password hashes scrubbed: %', n;
            if exists (select 1 from information_schema.columns
                        where table_schema = 'public' and table_name = 'users' and column_name = 'totp_secret') then
              update public.users
                 set totp_secret = null, totp_enabled = 0, totp_enrolled_at = null, totp_backup_codes = null
               where totp_secret is not null or totp_enabled <> 0 or totp_backup_codes is not null;
              get diagnostics n = row_count; raise notice 'TOTP cleared: % users', n;
            end if;

            -- 3. POS PINs and terminal tokens (same hash format as passwords).
            if to_regclass('public.pos_cashiers') is not null then
              update public.pos_cashiers set pin_hash = 'staging-scrubbed' where pin_hash <> 'staging-scrubbed';
              get diagnostics n = row_count; raise notice 'pos_cashiers PINs scrubbed: %', n;
            end if;
            if to_regclass('scm.pos_pins') is not null then
              update scm.pos_pins set pin_hash = 'staging-scrubbed' where pin_hash <> 'staging-scrubbed';
              get diagnostics n = row_count; raise notice 'scm.pos_pins PINs scrubbed: %', n;
            end if;
            if to_regclass('public.pos_terminals') is not null then
              update public.pos_terminals set token_hash = null, pairing_code_hash = null, pairing_expires_at = null
               where token_hash is not null or pairing_code_hash is not null;
              get diagnostics n = row_count; raise notice 'pos_terminals unpaired: %', n;
            end if;

            -- 4. HR + payroll. Identifiers become 'STG-' + 8 hex (stable per
            --    value, so duplicates still look like duplicates). Every money
            --    figure of one employee is multiplied by the same made-up
            --    factor (pg_temp.stg_pay_factor above), so payroll screens
            --    stay internally proportional but no real salary is left.
            --    Sums can differ from their parts by a few sen of rounding.
            if to_regclass('public.hr_employees') is not null then
              update public.hr_employees set
                ic_number       = case when ic_number       is null or ic_number = '' or ic_number       like 'STG-%' then ic_number       else 'STG-' || upper(left(md5(ic_number), 8)) end,
                passport_number = case when passport_number is null or passport_number = '' or passport_number like 'STG-%' then passport_number else 'STG-' || upper(left(md5(passport_number), 8)) end,
                bank_account    = case when bank_account    is null or bank_account = '' or bank_account    like 'STG-%' then bank_account    else 'STG-' || upper(left(md5(bank_account), 8)) end,
                basic_salary_sen     = round(basic_salary_sen * pg_temp.stg_pay_factor(id)),
                daily_rate_sen       = round(daily_rate_sen   * pg_temp.stg_pay_factor(id)),
                tax_child_relief_sen = round(tax_child_relief_sen * pg_temp.stg_pay_factor(id));
              get diagnostics n = row_count; raise notice 'hr_employees masked: %', n;
            end if;
            if to_regclass('public.hr_employee_salary_history') is not null then
              update public.hr_employee_salary_history
                 set basic_salary_sen = round(basic_salary_sen * pg_temp.stg_pay_factor(employee_id));
              get diagnostics n = row_count; raise notice 'hr_employee_salary_history masked: %', n;
            end if;
            if to_regclass('public.hr_payslips') is not null then
              select string_agg(format('%1$I = round(%1$I * pg_temp.stg_pay_factor(employee_id))', column_name), ', ')
                into cols
                from information_schema.columns
               where table_schema = 'public' and table_name = 'hr_payslips'
                 and column_name like '%\_sen' and data_type in ('bigint','integer','numeric');
              execute format(
                'update public.hr_payslips set %s, '
                || 'bank_account = case when bank_account is null or bank_account = '''' or bank_account like ''STG-%%'' then bank_account else ''STG-'' || upper(left(md5(bank_account), 8)) end, '
                || 'detail = coalesce(detail, ''{}''::jsonb) - ''allowances'' - ''trip''', cols);
              get diagnostics n = row_count; raise notice 'hr_payslips masked: %', n;
            end if;
            if to_regclass('public.sales_reps') is not null then
              update public.sales_reps set nric = 'STG-' || upper(left(md5(nric), 8))
               where nric is not null and nric <> '' and nric not like 'STG-%';
              get diagnostics n = row_count; raise notice 'sales_reps.nric masked: %', n;
            end if;
            if to_regclass('scm.helpers') is not null then
              update scm.helpers set ic_number = 'STG-' || upper(left(md5(ic_number), 8))
               where ic_number is not null and ic_number <> '' and ic_number not like 'STG-%';
              get diagnostics n = row_count; raise notice 'scm.helpers.ic_number masked: %', n;
            end if;
          end $$;
          SQL

      - name: Re-seed the staging login + showroom
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node scripts/staging-seed-account.mjs

      # The UPDATEs above succeeding is not evidence; finding nothing is. Each
      # check is on the SHAPE of what is left (a verifiable hash, a session
      # minted before the scrub, an unmasked IC), never on a row count, so a
      # re-run or a tester signing in mid-run cannot fake a pass or a failure.
      - name: Verify no production credential survived (fails the run)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SCRUB_STARTED: ${{ steps.scrub.outputs.started }}
        run: |
          set -euo pipefail
          test -n "$SCRUB_STARTED"
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At \
            -v started="$SCRUB_STARTED" <<'SQL'
          set timezone = 'UTC';
          select set_config('scrub.started', :'started', false);
          do $$
          declare
            started text := current_setting('scrub.started');
            bad text[] := '{}'; t text; n bigint; has_created boolean;
          begin
            -- A password hash that can verify ('salt$hash') may exist only on
            -- the seeded staging account, and that one MUST exist.
            select count(*) into n from public.users
             where password_hash like '%$%' and lower(email) <> 'hello@houzscentury.com';
            if n > 0 then bad := bad || format('%s users still hold a verifiable password hash', n); end if;
            if not exists (select 1 from public.users
                            where lower(email) = 'hello@houzscentury.com' and password_hash like '%$%') then
              bad := bad || 'the staging test account has no usable password (seed step did not land)'::text;
            end if;
            if exists (select 1 from information_schema.columns
                        where table_schema = 'public' and table_name = 'users' and column_name = 'totp_secret') then
              select count(*) into n from public.users where totp_secret is not null or totp_backup_codes is not null;
              if n > 0 then bad := bad || format('%s users still hold a TOTP secret', n); end if;
            end if;

            -- Token tables: a row is fine only if staging minted it after the scrub.
            foreach t in array array['public.sessions','public.password_resets','public.invitations',
                                     'public.push_devices','public.share_export_log',
                                     'public.contractor_share_tokens','public.brand_share_tokens',
                                     'public.email_outbox'] loop
              continue when to_regclass(t) is null;
              select exists (select 1 from information_schema.columns
                              where table_schema || '.' || table_name = t and column_name = 'created_at')
                into has_created;
              if has_created then
                execute format('select count(*) from %s where created_at is null or replace(created_at::text, ''T'', '' '') < %L', t, started) into n;
              else
                execute format('select count(*) from %s', t) into n;
              end if;
              if n > 0 then bad := bad || format('%s: %s rows from production', t, n); end if;
            end loop;

            if to_regclass('public.pos_cashiers') is not null then
              select count(*) into n from public.pos_cashiers where pin_hash like '%$%' and updated_at::text < started;
              if n > 0 then bad := bad || format('pos_cashiers: %s production PIN hashes', n); end if;
            end if;
            if to_regclass('scm.pos_pins') is not null then
              select count(*) into n from scm.pos_pins where pin_hash like '%$%';
              if n > 0 then bad := bad || format('scm.pos_pins: %s production PIN hashes', n); end if;
            end if;

            if to_regclass('public.hr_employees') is not null then
              select count(*) into n from public.hr_employees
               where (ic_number is not null and ic_number <> '' and ic_number not like 'STG-%')
                  or (passport_number is not null and passport_number <> '' and passport_number not like 'STG-%')
                  or (bank_account is not null and bank_account <> '' and bank_account not like 'STG-%');
              if n > 0 then bad := bad || format('hr_employees: %s rows with a real IC / passport / bank account', n); end if;
            end if;
            if to_regclass('public.hr_payslips') is not null then
              select count(*) into n from public.hr_payslips
               where (bank_account is not null and bank_account <> '' and bank_account not like 'STG-%')
                  or detail ? 'allowances' or detail ? 'trip';
              if n > 0 then bad := bad || format('hr_payslips: %s rows with a real bank account or pay breakdown', n); end if;
            end if;
            if to_regclass('public.sales_reps') is not null then
              select count(*) into n from public.sales_reps where nric is not null and nric <> '' and nric not like 'STG-%';
              if n > 0 then bad := bad || format('sales_reps: %s real NRICs', n); end if;
            end if;
            if to_regclass('scm.helpers') is not null then
              select count(*) into n from scm.helpers where ic_number is not null and ic_number <> '' and ic_number not like 'STG-%';
              if n > 0 then bad := bad || format('scm.helpers: %s real IC numbers', n); end if;
            end if;

            if cardinality(bad) > 0 then
              raise exception 'PRODUCTION DATA SURVIVED THE SCRUB: %', array_to_string(bad, '; ');
            end if;
            raise notice 'scrub verified: no production password, session, token, PIN or HR identifier left';
          end $$;
          SQL
          echo "credential scrub verified (sessions, tokens, password hashes, TOTP, POS PINs, HR identifiers)" >> "$GITHUB_STEP_SUMMARY"

      # Make staging answer "can staff save this?" the way production does
      # (docs/bugs/0840). The switches are applied EXPLICITLY rather than left to
      # the data dump: app_config is one row per switch, and a row that silently
      # does or does not survive a truncate+restore is the difference between a
      # faithful rehearsal and a misleading one. Before/after is printed for both
      # keys so a red rehearsal caused by a production freeze is explainable at a
      # glance rather than looking like a defect.
      - name: Mirror production's operational switches onto staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          if [ ! -s prod-switches.txt ]; then
            echo "::warning title=No production switches captured::prod-switches.txt is missing or empty — staging keeps its own scm.app_config values."
            exit 0
          fi
          {
            echo ""
            echo "### Operational switches (production -> staging)"
            echo ""
            echo "| key | production | staging before | staging after |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS='=' read -r key val; do
            [ -n "$key" ] || continue
            before=$("$PSQL" "$DATABASE_URL" -v ON_ERROR_STOP=1 -At \
              -c "select coalesce(value,'') from scm.app_config where key = '$key'")
            "$PSQL" "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
              insert into scm.app_config (key, value, updated_at)
              values ('$key', '$val', now())
              on conflict (key) do update set value = excluded.value, updated_at = now()"
            after=$("$PSQL" "$DATABASE_URL" -v ON_ERROR_STOP=1 -At \
              -c "select coalesce(value,'') from scm.app_config where key = '$key'")
            echo "switch $key: prod='$val' staging '$before' -> '$after'"
            echo "| \`$key\` | \`$val\` | \`${before:-<absent>}\` | \`$after\` |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$before" != "$after" ]; then
              echo "::notice title=Staging switch changed::$key was '${before:-<absent>}' on staging and is now '$after' (production's value)."
            fi
          done < prod-switches.txt

      - name: Row counts AFTER (staging) — fail if any document table is empty
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          out=$(/usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "
            select t || ': ' || n from (
              select 'scm.mfg_sales_orders' t, count(*) n from scm.mfg_sales_orders union all
              select 'scm.purchase_orders',   count(*) from scm.purchase_orders   union all
              select 'scm.grns',              count(*) from scm.grns              union all
              select 'scm.delivery_orders',   count(*) from scm.delivery_orders   union all
              select 'scm.purchase_invoices', count(*) from scm.purchase_invoices union all
              select 'scm.sales_invoices',    count(*) from scm.sales_invoices
            ) x;")
          echo "$out" | sed 's/^/after /'
          if echo "$out" | grep -qE ': 0$'; then
            echo "::error::a document table is EMPTY after restore — the copy did not land"; exit 1
          fi
          echo "staging refreshed from production at $(date -u +%FT%TZ) (masked: ${{ inputs.mask_pii }})" >> "$GITHUB_STEP_SUMMARY"
          echo "$out" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
