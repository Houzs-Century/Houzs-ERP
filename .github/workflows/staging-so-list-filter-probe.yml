name: Staging SO list filter probe (rolled back)

# Measures, on the STAGING database, what the Sales Order list line-level
# filter functions (migrations-pg 20260914T1600) cost: they are created INSIDE
# one transaction, measured as service_role with EXPLAIN ANALYZE, and the whole
# transaction is ROLLED BACK. Exit 0 for every legitimate answer.
# Manual trigger only. Own concurrency group.

on:
  workflow_dispatch:

concurrency:
  group: staging-so-list-filter-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Assert the target is STAGING
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          case "$DATABASE_URL" in *anogrigyjbduyzclzjgn*) echo "::error::points at PRODUCTION"; exit 1;; esac
          case "$DATABASE_URL" in *minnapsemfzjmtvnnvdd*) echo "target: staging";; *) echo "::error::not the staging project"; exit 1;; esac
      - name: Census and timings
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -uo pipefail
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=0 -X -f backend/scripts/sql/staging-so-list-filter-probe.sql
