name: Supplier listing vs our POs - BEDFRAME (read-only)

# Where our BEDFRAME lines disagree with the supplier's own listing. A separate
# script from the sofa one because a bedframe is a whole bed, not a run of
# compartments: sequence carries no meaning, and the variant grammar is
# div/gap/leg in inches, not the sofa reader. The sofa check run over bedframes
# produced 53 false "different order" and 239 false "different variant" rows
# (run 34501427768).
#
# SELECT only. Manual trigger. Own concurrency group. Exit 0 for every answer.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      company_id:
        description: "Company. Blank = 1."
        required: false
        default: ""
      list_limit:
        description: "Rows to name per bucket. Blank = 60."
        required: false
        default: ""

concurrency:
  group: check-supplier-bedframe-vs-erp-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-supplier-bedframe-vs-erp.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          LIST_LIMIT: ${{ inputs.list_limit }}
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-supplier-bedframe-vs-erp.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          LIST_LIMIT: ${{ inputs.list_limit }}
          NODE_OPTIONS: --dns-result-order=ipv4first
