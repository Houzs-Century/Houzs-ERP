name: Backfill migrated DO header snapshot from the SO (DRY-RUN gated)

# create-migrated-documents.mjs wrote delivery-order HEADERS with twelve
# columns and never the customer / delivery snapshot the UI writer copies from
# the SO — address, phone, email, salesperson, agent, customer type, building
# type, branding, venue, ref, sales location, emergency contact, customer
# delivery date. Every AutoCount-mirrored DO opened with Phone / Email /
# Address / Salesperson / Delivery date all "—" (HC-DO-011559, 2026-09-08).
#
# A delivery order is a SNAPSHOT OF THE SALES ORDER AT DISPATCH, so the parent
# is delivery_orders.so_doc_no and the mapping is the one /from-sos applies.
# Where the SO is itself blank on a field the DO stays blank and the plan says
# so; nothing is invented.
#
# Never overwrites a stated value — every SET re-asserts that the column IS
# NULL. Writes no movement, no status, no money column.
#
# DRY-RUN unless apply=1. Idempotent.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "1 to write, anything else DRY-RUN"
        required: false
        default: "0"
        type: string
      company:
        description: "company_id"
        required: false
        default: "1"
        type: string
      scope:
        description: "migrated = documents the migrated writer made; all = every DO in the company"
        required: false
        default: "migrated"
        type: choice
        options: [migrated, all]
      do_number:
        description: "limit to ONE DO number (e.g. HC-DO-011559); blank = whole scope"
        required: false
        default: ""
        type: string
      cap:
        description: "max plan documents to print"
        required: false
        default: "40"
        type: string

concurrency:
  group: backfill-migrated-do-header
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/backfill-migrated-do-header.mjs
        env:
          APPLY: ${{ inputs.apply }}
          COMPANY: ${{ inputs.company }}
          SCOPE: ${{ inputs.scope }}
          DO: ${{ inputs.do_number }}
          CAP: ${{ inputs.cap }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
