name: Census the array-shaped custom_specials

# Manual. #1944 NULLed the custom_specials values that the old sofa backfill
# double-encoded into jsonb STRING scalars. It deliberately left every
# ARRAY-shaped value alone, and jsonb_typeof cannot tell a correct
# Array<{description, surchargeSen}> from a bare string[] of verbatim slip
# phrases — both read as 'array'. This classifies them per row and reports
# counts plus a sample of each class, with the evidence the verdict rests on:
# whether each string is a LIVE picker code or raw slip text, whether the line
# is migrated, and whether variants.specials (the field the picker reads)
# already carries codes.
#
# WHAT THE FIRST PROD RUN FOUND (31428435434, 2026-08-11). All 604 array-shaped
# rows (SO 511, PO 93) are bare string[]; none is the declared object shape.
# But 679 of their 694 strings are LIVE picker codes, every row is migrated, and
# every row's variants.specials holds exactly as many entries as its
# custom_specials. So the content is RIGHT and only the shape is legacy — which
# refutes the leg #1944's repair stood on ("valid jsonb holding wrong data is
# worse than empty"). NULLing them would delete a correct, currently-rendering
# line item from 604 historical documents. The script therefore reports those as
# NOT candidates.
#
# The only wrong-content rows are the 15 carrying raw slip text (BOTHWANT,
# FABRICHARRING, LSIDE, DAYBED, "request to normal leg and not fully cover") —
# and the same text sits in variants.specials, the field the PICKER reads, so
# nulling only the derived cache hides it from the report and leaves it in the
# operator's view. That is an owner decision, so it needs apply=1 AND
# apply_text=1 together. Every value is printed IN FULL before any write; the
# count comes from RETURNING and is confirmed on a fresh connection.
#
# DRY-RUN by default and read-only in that mode.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      company:
        description: "company_id"
        required: false
        default: "1"
        type: string
      apply:
        description: "1 to write, else DRY-RUN. Alone it does nothing: the only writable class also needs apply_text"
        required: false
        default: "0"
        type: string
      apply_text:
        description: "1 ONLY after the owner has decided what happens to the same raw text in variants.specials"
        required: false
        default: "0"
        type: string
      show:
        description: "how many rows of the repairable classes to print"
        required: false
        default: "800"
        type: string

concurrency:
  group: census-custom-specials-arrays-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/census-custom-specials-arrays.mjs
        env:
          APPLY: ${{ inputs.apply }}
          APPLY_TEXT: ${{ inputs.apply_text }}
          COMPANY: ${{ inputs.company }}
          SHOW: ${{ inputs.show }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/census-custom-specials-arrays.mjs
        env:
          APPLY: ${{ inputs.apply }}
          APPLY_TEXT: ${{ inputs.apply_text }}
          COMPANY: ${{ inputs.company }}
          SHOW: ${{ inputs.show }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
