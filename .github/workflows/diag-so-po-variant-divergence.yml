name: SO/PO variant divergence diagnostic (read-only)

# Why a migrated SO line's variants disagree with the PO raised from it when both
# documents carry the SAME AutoCount Desc2. Measures the (DocNo|item_code) lookup
# collision in refresh-so-variants.mjs, its blast radius across every migrated
# bedframe SO line, and sweeps linked SO/PO pairs for a truncated fabric code.
# See backend/scripts/diag-so-po-variant-divergence.mjs.
#
# Manual trigger only - a diagnostic question, never a scheduled production read.
on:
  workflow_dispatch:
    inputs:
      so_docs:
        description: "comma-separated SO doc_no list for section A (blank = the named 14 + exception + truncation pair)"
        required: false
        default: ""
        type: string

# Own group, never the deploy's: it touches nothing and must not queue behind a
# release.
concurrency:
  group: diag-so-po-variant-divergence
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/diag-so-po-variant-divergence.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SO_DOCS: ${{ inputs.so_docs }}
          # GitHub-hosted runners have no IPv6 egress; mirror soak-gate/deploy so
          # an IPv4-only pooler host resolves.
          NODE_OPTIONS: --dns-result-order=ipv4first
