name: Repair PO line discount (plan by default)

# AutoCount's purchase-order lines carry a LINE DISCOUNT and the ERP stored
# qty x unit price undiscounted, so a migrated purchase order overstates what we
# owe the supplier. PO-009948 is the worked example: a unit price of RM 1,880.00
# on a line AutoCount totals at RM 1,410.00, exactly 75%.
# Ledger: docs/bugs/0662-autocount-po-line-discounts-are-dropped-the-erp-stores-qty-x.md
#
# PLAN IS THE DEFAULT AND WRITES NOTHING. It prints, per document, the ERP total
# now, the AutoCount total and the difference, then every line it would change
# and every line it REFUSES. Run it, read it, and only then decide.
#
# APPLY MOVES MONEY ON LIVE DOCUMENTS. It needs apply=yes AND the confirm phrase
# typed in full. It writes `discount_sen` + `line_total_sen` on the line and
# recomputes `subtotal_sen` + `total_sen` on the header, which is exactly the
# invariant the app's own PO routes maintain (mfg-purchase-orders.ts:3042 and
# :2798) — correcting the line total alone would be undone by the next person
# who edits that line in the UI.
#
# It does NOT touch unit_price_sen (AutoCount's own UnitPrice is the undiscounted
# figure and copying it is correct), does NOT change stock cost (a receipt is
# costed at the undiscounted unit price, grns.ts:555), and does NOT reach into
# goods receipts or purchase invoices already raised from these orders.
#
# The AutoCount side comes from the committed snapshot
# backend/scripts/data/ac-reconcile-truth.json.gz, re-cut on a machine on the
# office network with
#   AC_CRED_FILE=<path> node backend/scripts/export-ac-reconcile-truth.mjs
# The script REFUSES a snapshot older than max_snapshot_age_days rather than
# moving money against a stale book.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      apply:
        description: "yes = WRITE. Anything else = PLAN only, which is the default."
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      confirm:
        description: 'Type I HAVE REVIEWED THE PO DISCOUNT PLAN to arm apply. Ignored when apply=no.'
        required: false
        default: ""
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
        type: string
      max_snapshot_age_days:
        description: "Refuse an AutoCount snapshot older than this many days."
        required: false
        default: "2"
        type: string

# Its own group, never the deploy's: this must not queue behind, or displace, a
# release. Not cancel-in-progress — cancelling an APPLY mid-write is the one
# thing worse than waiting.
concurrency:
  group: repair-po-line-discount-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    environment: Production
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/repair-po-line-discount.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/repair-po-line-discount.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
