name: probe-doc-writeback (read-only, one document)

# "I saved this document — did the change reach AutoCount, and if not, what
# stopped it?" for ONE named document.
#
# WHY IT IS SAFE IN A PUBLIC LOG. It prints statuses, ops, counts and a
# CLASSIFIED reason code. `last_error` is never quoted — a keyless-line refusal
# names real item codes — only its shape and length. The document number appears
# because the operator typed it into the dispatch inputs.
#
# Manual trigger only, per CLAUDE.md: a production DB read on a schedule turns a
# real question into CI noise nobody reads. Its own concurrency group, so a
# diagnostic never queues behind or displaces a release.
#
# SELECT only — no DDL, no writes, no transaction. The verdict is the output, so
# it exits 0 for every legitimate answer, including "no rows at all".
on:
  workflow_dispatch:
    inputs:
      doc_no:
        description: 'ERP document number (sales order doc no, or purchase order number)'
        required: true
        type: string
      company_id:
        description: 'Company id (1 = HOUZS / Houzs Century)'
        required: false
        default: '1'
        type: string

concurrency:
  group: probe-doc-writeback
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: backend
      - name: probe (read-only)
        working-directory: backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          DOC_NO: "${{ inputs.doc_no }}"
          COMPANY_ID: "${{ inputs.company_id }}"
        run: node scripts/check-so-venue-binding.mjs
