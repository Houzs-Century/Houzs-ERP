name: PO arm vs its own AutoCount text (read-only)

# Section B of the SO/PO variant divergence diagnostic asks whether a migrated
# bedframe line's variants are backed by that line's OWN AutoCount text, and
# answers it for the SALES ORDER arm. This asks the same question of the
# PURCHASE ORDER arm, corpus-wide, segmented by whether the outstanding-PO
# export covered the line - because a received PO is not "outstanding", so most
# PO lines fell through to a per-line fallback that cannot collide.
# See backend/scripts/check-po-arm-own-text.mjs.
#
# Manual trigger only - a diagnostic question, never a scheduled production read.
on:
  workflow_dispatch:

# Own group, never the deploy's: it touches nothing and must not queue behind -
# or displace - a release.
concurrency:
  group: check-po-arm-own-text
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-po-arm-own-text.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; mirror soak-gate/deploy so
          # an IPv4-only pooler host resolves.
          NODE_OPTIONS: --dns-result-order=ipv4first
