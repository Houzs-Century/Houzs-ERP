name: fix-bench-sides

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Database"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      mode:
        description: "dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, apply]
      confirm:
        description: "For apply, type: I HAVE REVIEWED THE DRY-RUN"
        required: false
        default: ""
        type: string

concurrency:
  group: fix-bench-sides
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - name: Fix bench sides
        env:
          DATABASE_URL: ${{ inputs.target == 'prod' && secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: node scripts/fix-bench-sides.mjs
