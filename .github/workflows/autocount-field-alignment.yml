name: AutoCount write-back — field alignment (read-only)

# Answers "is every field the write-back sends read from the column the ERP
# actually keeps it in", with a number per field, without anyone opening a SQL
# console.
#
# Three faults of one shape have already reached the live account book — a value
# the ERP holds in one place, the composer reading another, and nothing opening
# it on the AutoCount side. Two of them (FK_SODTL_Location, FK_SO_SalesAgent)
# were found only when a real document failed. This is the report that finds the
# rest before a salesperson does.
#
# Manual trigger only. A production DB read on a schedule turns a real question
# into CI noise nobody reads (CLAUDE.md), and this one answers a question that
# changes only when the schema or the composer changes.
#
# Runs under tsx, NOT plain node: the script imports AGENT_MAP / LOCATION_MAP /
# VENUE_MAP / BRANDING_MAP and mapOrPassthrough from the composer itself, so the
# report cannot drift from what the write-back really does. Same shape as
# recompute-so-allocation.yml, which imports a real service function the same way.
on:
  workflow_dispatch:

# Deliberately NOT in the deploy concurrency group: this touches nothing and
# must never queue behind — or displace — a release.
concurrency:
  group: autocount-field-alignment
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/check-autocount-field-alignment.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first
