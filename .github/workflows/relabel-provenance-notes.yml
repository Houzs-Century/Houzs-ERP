name: Relabel PO provenance notes (DRY-RUN gated)

# Moves `scm.purchase_orders.notes` from the pre-2026-08-18 provenance labels
# ("From SOs:", "From SO:") onto the unified wording generated by the #2370
# transfer-label rule ("Transfer from Sales Order:").
#
# THIS IS A PRODUCTION DATA WRITE, not a cosmetic pass. For an MRP-raised PO the
# note is the ONLY stored record of which Sales Orders it was bought for (those
# POs carry no per-line so_item_id), and eight readers parse it.
#
# The safety argument, in the order the script performs it:
#   1. CENSUS first — how many notes, by exact label, per company.
#   2. PLAN — any row whose doc numbers would change is REFUSED, not written.
#   3. MANIFEST — {id, po_number, company_id, before, after} for every planned
#      row, uploaded below. DRY-RUN produces one too; that is the review copy.
#   4. WRITE — one row at a time, `WHERE notes = <exact prior value>`, so a note
#      edited since the plan was built is skipped and reported, never clobbered.
#   5. POST-CONDITION — every touched row is RE-READ from the database and
#      re-parsed, and must yield the SAME doc numbers as before. Any mismatch
#      fails the job.
#
# IDEMPOTENT: a note already on the current label is not planned, so a second
# apply run writes nothing.
#
# ROLLBACK: download the manifest artifact from the run, then dispatch this
# workflow with mode=revert and pass the manifest path. Revert only restores
# rows that still hold exactly what the migration wrote.
#
# DRY-RUN unless apply=1 AND confirm is typed out in full.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "1 to write, anything else DRY-RUN"
        required: false
        default: "0"
        type: string
      mode:
        description: "relabel, or revert using a manifest"
        required: false
        default: relabel
        type: choice
        options:
          - relabel
          - revert
      company:
        description: "optional company_id to limit the run (blank = every company)"
        required: false
        default: ""
        type: string
      manifest:
        description: "manifest path — for mode=revert, the file restored from"
        required: false
        default: "out/relabel-provenance-notes.json"
        type: string
      confirm:
        description: 'apply=1 only: type exactly  relabel provenance notes'
        required: false
        default: ""
        type: string

concurrency:
  group: relabel-provenance-notes
  cancel-in-progress: false

jobs:
  relabel:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      # The invariant this migration rests on is a unit test, so prove it on
      # this commit BEFORE touching production rather than after.
      - name: Prove the vocabulary invariants
        run: npx vitest run --config vitest.light.config.mts tests/transferVocabulary.corpus.test.ts

      - run: node scripts/relabel-provenance-notes.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          MODE: ${{ inputs.mode }}
          COMPANY: ${{ inputs.company }}
          MANIFEST: ${{ inputs.manifest }}
          # A phrase that has to be TYPED on the run that writes. apply=1 is one
          # character away from a dry run and sits in a dropdown; this does not.
          CONFIRM: ${{ inputs.confirm }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first

      # ALWAYS, including on failure: if the post-condition check failed, this
      # artifact is the only thing that can put the rows back.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relabel-provenance-notes-${{ inputs.apply == '1' && 'apply' || 'dryrun' }}-${{ github.run_id }}
          path: backend/out/*.json
          if-no-files-found: warn
          retention-days: 90
