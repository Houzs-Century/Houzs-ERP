name: SO non-catalog lines check (read-only)

# Owner rulings 2026-08-08: every SO line is a REAL catalog SKU ("为什么会有
# 这样的 sku square pillow 你可以允许 freetext 的吗!?" — HC-SO-2607-013), a
# confirmed order has a salesperson (HC-SO-2607-008 was "Unassigned"), a venue
# ("venue is compulsory的"), and complete required variants on every goods
# line. The live guards now refuse all four shapes on NEW writes; this
# read-only check lists the EXISTING damage — one row per offending line /
# order, with a TEST? hint for the "Jalan Test" batch — so the owner can
# decide the fix per line. There is deliberately NO repair mode: each row
# needs a human to pick the right SKU / salesperson / venue.
#
# Exit 0 for every legitimate answer — clean and dirty are both answers.
# Manual trigger only, own concurrency group — never the deploy's.
on:
  workflow_dispatch:

concurrency:
  group: so-noncatalog-lines
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-so-noncatalog-lines.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first
