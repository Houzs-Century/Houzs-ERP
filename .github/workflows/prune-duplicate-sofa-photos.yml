name: Prune duplicate sofa photos

# Manual. One AutoCount sofa line is ONE photograph of ONE build; the importers
# used to copy it onto every compartment row. This removes the copies, keeping
# the one on the first row of each build. DRY-RUN unless apply=1.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      company:
        description: "company_id"
        required: false
        default: "1"
        type: string
      apply:
        description: "1 to write, else DRY-RUN"
        required: false
        default: "0"
        type: string

concurrency:
  group: prune-duplicate-sofa-photos-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/prune-duplicate-sofa-photos.mjs
        env:
          APPLY: ${{ inputs.apply }}
          COMPANY: ${{ inputs.company }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/prune-duplicate-sofa-photos.mjs
        env:
          APPLY: ${{ inputs.apply }}
          COMPANY: ${{ inputs.company }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
