name: rename-minted-sofa-sku-names

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Database"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      mode:
        description: "dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, apply]

concurrency:
  group: rename-minted-sofa-sku-names
  cancel-in-progress: false

jobs:
  rename:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run rename
        env:
          DATABASE_URL: ${{ inputs.target == 'prod' && secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          APPLY: ${{ inputs.mode == 'apply' && '1' || '' }}
        run: node scripts/rename-minted-sofa-sku-names.mjs
