name: SO warehouse + venue final check (read-only)

# Owner 2026-08-02, two definitive questions:
#  Q1. Does every live SO have a salesperson AND a correct Sales Venue?
#  Q2. Does every live SO have a Warehouse (bound from postcode/state)? Where not,
#      is it a "Fill in later" order with no Processing Date yet (expected), or a
#      PROCEEDED SO with no warehouse (a real defect)?
#
# SELECT only. The verdict is the output.
on:
  workflow_dispatch:

concurrency:
  group: so-warehouse-venue-final
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-so-warehouse-venue-final.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
