name: Backfill specials into variants

# Manual. Redo of "Backfill sofa special orders", into the field the picker
# actually reads: variants.specials. The earlier pass wrote custom_specials,
# which the picker never reads and which the SO line PATCH regenerates from
# variants on the first edit.
#
# Covers SO + PO lines, sofa + bedframe. Merges into variants.specials as a
# de-duplicated string[] of picker codes, preserving every other variants key
# and every code already there. custom_specials is left alone.
#
# The picker master (scm.special_addons) is read LIVE with its prices; a phrase
# with no owner code is REPORTED, never invented. APPLY refuses to run if any
# code it would stamp is priced — that reprices historical documents and is an
# owner decision.
#
# skip_priced=1 lands the money-neutral majority WITHOUT that decision: only
# codes priced 0/0 in the live read are stamped, and any line that would newly
# receive a priced code is held back whole. That write runs in one transaction
# that sums the affected lines' money columns before and after and rolls back on
# any difference.
#
# DRY-RUN unless apply=1; the report is the ##[notice] lines.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      company:
        description: "company_id"
        required: false
        default: "1"
        type: string
      apply:
        description: "1 to write, else DRY-RUN"
        required: false
        default: "0"
        type: string
      show:
        description: "how many per-line changes to print"
        required: false
        default: "40"
        type: string
      skip_priced:
        description: "1 to stamp ONLY 0/0-priced codes and hold back every line that would gain a priced one"
        required: false
        default: "0"
        type: string
      diag:
        description: "1 to add the HYDRAULIC / unmapped-tail diagnostic (read-only)"
        required: false
        default: "0"
        type: string

concurrency:
  group: backfill-specials-into-variants-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/backfill-specials-into-variants.mjs
        env:
          APPLY: ${{ inputs.apply }}
          SKIP_PRICED: ${{ inputs.skip_priced }}
          DIAG: ${{ inputs.diag }}
          COMPANY: ${{ inputs.company }}
          SHOW: ${{ inputs.show }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/backfill-specials-into-variants.mjs
        env:
          APPLY: ${{ inputs.apply }}
          SKIP_PRICED: ${{ inputs.skip_priced }}
          DIAG: ${{ inputs.diag }}
          COMPANY: ${{ inputs.company }}
          SHOW: ${{ inputs.show }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # TEMPORARY (this branch only) — record-priced-specials.yml is not yet on
      # the default branch, so it cannot be workflow_dispatch'd. Runs PLAN only:
      # MODE defaults to plan and plan writes nothing.
      - run: node scripts/record-priced-specials-on-migrated-lines.mjs
        env:
          MODE: plan
          COMPANY: ${{ inputs.company }}
          SHOW: "60"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
