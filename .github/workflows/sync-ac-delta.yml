name: Sync AutoCount delta (go-live)

# Manual. The documents that MOVED in AutoCount since the last import cut.
#
# Every AutoCount importer in backend/scripts is INSERT-ONLY, so a re-run brings
# in NEW documents and silently ignores every already-migrated document that
# CHANGED in the book. This is the tool that sees the changed ones.
#
# PLAN is the default and it writes nothing: it prints the per-type census
# (moved / created / edited / in the ERP / absent / importable), the documents it
# REFUSES because a person edited them in the ERP, the sofa compartment sets that
# now disagree, and the SO->PO dedications it would write.
#
# It also reports the HEADER MASTER census: for every field the importer reads
# at insert - sales agent, debtor code and name, the invoice address, phone,
# Ref, venue, branding, processing date, remarks - how many migrated documents
# AGREE with AutoCount, how many DIFFER, and how many the ERP holds blank while
# AutoCount has a value.
#
# apply=yes needs the confirm phrase typed in full, and writes only the lanes
# named in `lanes`:
#   desc      line description2
#   pay       the migrated payment / balance row
#   links     the SO->PO line dedication the header-stamp delta can see
#   recv      received_qty, copied from AutoCount's per-line PODTL.TransferedQty
#   do        the delivery documents for orders AutoCount has delivered and the
#             ERP does not reflect - migrated_no_stock = true, NO inventory movement
#   dedi      the SO->PO dedications only the truth snapshot can see
#   hdr       header master fields - OFF by default. Every UPDATE is guarded on
#             the value the plan read, and a field a PERSON edited is refused.
#   hdrstaff  CREATES an inactive salesperson row per unbound AutoCount agent -
#             OFF by default, because it is a WRITE TO MASTER DATA. Every row
#             carries an ACIMP- staff_code so the whole set is reversible, and
#             it never activates anybody.
# The INSERT lane belongs to the importers the plan names
# (import-ac-outstanding-so.mjs, import-ac-outstanding-po.mjs,
# import-ac-so-linked-pos.mjs) and is NOT run from here.
#
# The three conversion lanes (recv / do / dedi) read
# backend/scripts/data/ac-reconcile-truth.json.gz, which is re-cut from a desktop
# on the ZeroTier link with
#   AC_CRED_FILE=... node backend/scripts/export-ac-reconcile-truth.mjs
# and is subject to the same MAX_SNAPSHOT_AGE_DAYS refusal as the stamps cut.
#
# Two AutoCount snapshots are committed and re-cut from a desktop on the
# ZeroTier link, both through the ONE exporter:
#   ONLY=stamps AC_CRED_FILE=... python backend/scripts/export-ac-reimport.py
#   ONLY=hdr    AC_CRED_FILE=... python backend/scripts/export-ac-reimport.py
# (ac-doc-stamps.json.gz and ac-doc-headers.json.gz respectively)
# The script REFUSES to run against a snapshot older than MAX_SNAPSHOT_AGE_DAYS.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "staging"
        type: choice
        options: [staging, prod]
      apply:
        description: "yes = write the lanes named in `lanes`. Anything else = PLAN only."
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      confirm:
        description: 'Type SYNC AC DELTA to arm apply. Ignored when apply=no.'
        required: false
        default: ""
        type: string
      lanes:
        description: "Apply lanes (comma separated): desc,pay,links,recv,do,dedi,hdr,hdrstaff. hdr/hdrstaff are OFF by default."
        required: false
        default: "desc,pay,links,recv,do,dedi"
        type: string
      do_scope:
        description: "Lane do: since = deliveries raised after we copied the order (default). all = plus the pre-migration history the owner decided not to import."
        required: false
        default: "since"
        type: choice
        options: [since, all]
      max_snapshot_age_days:
        description: "Refuse a stamps snapshot older than this many days."
        required: false
        default: "2"
        type: string

concurrency:
  group: sync-ac-delta-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/sync-ac-delta.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          LANES: ${{ inputs.lanes }}
          DO_SCOPE: ${{ inputs.do_scope }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/sync-ac-delta.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          LANES: ${{ inputs.lanes }}
          DO_SCOPE: ${{ inputs.do_scope }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
