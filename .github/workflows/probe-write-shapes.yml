name: Probe which write shape survives a commit

# Manual. `refresh-sofa-colours.mjs` writes with ONE shape - postgres.js,
# sql.begin, tx.unsafe(text, values) - reports the command tag, and the data is
# not there on re-read. The same shape sits behind seven staff endpoints via
# scm/lib/pg-supabase-transaction.ts, including the sofa colour fill-in, so
# "which shape persists" is a go-live question, not only a repair question.
#
# It writes nothing invented: it takes rows already in the TO FILL set - rows
# every apply is trying to stamp anyway - writes each with a different shape,
# then closes the pool and re-reads them on a BRAND NEW connection. Nothing is
# deleted, no scratch table, no DDL. Worst case is the intended data on 5 rows.
#
# DRY-RUN unless apply=1.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      company:
        description: "company_id"
        required: false
        default: "1"
        type: string
      apply:
        description: "1 to write the 5 canary rows, else DRY-RUN"
        required: false
        default: "0"
        type: string

concurrency:
  group: refresh-sofa-colours-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/probe-write-shapes.mjs
        env:
          APPLY: ${{ inputs.apply }}
          COMPANY: ${{ inputs.company }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/probe-write-shapes.mjs
        env:
          APPLY: ${{ inputs.apply }}
          COMPANY: ${{ inputs.company }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
