name: SO PO GR alignment lane — the verdict, with every offender named (read-only)

# WHY A SECOND COPY OF A QUESTION THAT ALREADY HAS A WORKFLOW.
#
# `po-gr-tally-verdict.yml` answers the same question and this does not replace
# it. Two things are different and both are the reason this file exists.
#
#   1. IT UPLOADS THE MACHINE-READABLE VERDICT. check-po-gr-tally.mjs writes one
#      `<TYPE>-verdict.json` per type into a temp directory and then throws it
#      away when the runner is torn down. That file carries the PER-DOCUMENT
#      rows — the axis, the cause, the AutoCount line key, the proceeded flag —
#      and the printed log carries only the first SHOW of them. A lane whose job
#      is to take three document types to zero has to work from the rows, not
#      from a truncated list, and re-running the report every time it needs the
#      21st offender is how a read of production becomes a habit.
#
#   2. IT HAS ITS OWN CONCURRENCY GROUP. The other workflow is
#      `cancel-in-progress: true` on the group `po-gr-tally-verdict`, and a
#      parallel lane owns DELIVERY ORDERS, SALES INVOICES and PURCHASE INVOICES
#      on that same report. Dispatching it from here would CANCEL their run
#      mid-flight, and theirs would cancel this one. Neither lane would notice:
#      a cancelled run looks like a run that was never asked for.
#
# READ-ONLY, AND IT WRITES NOTHING TO PRODUCTION. It runs exactly the same
# entry point as the other workflow — check-po-gr-tally.mjs, which spawns
# check-ac-erp-reconcile.mjs: SELECTs only, one connection, no DDL, no
# transaction, no MODE=apply, no publish step. The only thing added here is
# `VERDICT_DIR` being kept and uploaded.
#
# The AutoCount side is the committed snapshot
# backend/scripts/data/ac-reconcile-truth.json.gz — the book is reachable only
# over ZeroTier from the office network, which a GitHub-hosted runner has no
# route to. The checker REFUSES when that snapshot is stale rather than
# answering against an old book.
on:
  workflow_dispatch:
    inputs:
      types:
        description: "Document types to answer for. This lane owns SO, PO and GR; the other three are the parallel lane's and are NOT asked for by default"
        required: false
        default: "SO,PO,GR"
        type: string
      show:
        description: "Offenders to PRINT per section. The uploaded JSON carries every one regardless of this"
        required: false
        default: "400"
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
      max_snapshot_age_days:
        description: "Refuse if the AutoCount snapshot is older than this many days"
        required: false
        default: "2"
      reconcile_log:
        description: "Also print the full reconcile log underneath the verdicts (long)"
        required: false
        default: false
        type: boolean

concurrency:
  group: align-so-po-gr-verdict
  cancel-in-progress: true

jobs:
  verdict:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: The verdicts
        run: node scripts/check-po-gr-tally.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPES: ${{ inputs.types }}
          SHOW: ${{ inputs.show }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          RECONCILE_LOG: ${{ inputs.reconcile_log }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first

      # NOT A CODE CHANGE. check-po-gr-tally.mjs mints its own
      # `po-gr-tally-*` temp directory and writes one `<TYPE>-verdict.json`
      # into it; this copies that directory out instead of asking a
      # load-bearing script — the one the sales-order lock reads through — to
      # learn a new environment variable for a reporting convenience.
      # `os.tmpdir()` is /tmp on a hosted runner, but RUNNER_TEMP is checked
      # too so the step does not depend on which of the two Node picked.
      - name: Collect the per-document rows
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/verdicts"
          found=0
          for d in /tmp/po-gr-tally-* "$RUNNER_TEMP"/po-gr-tally-*; do
            [ -d "$d" ] || continue
            cp -v "$d"/*.json "$GITHUB_WORKSPACE/verdicts/" 2>/dev/null && found=1
          done
          if [ "$found" = "0" ]; then
            echo "No verdict files were written. The reconcile refused before it emitted any."
          fi
          ls -la "$GITHUB_WORKSPACE/verdicts/" || true

      # ALWAYS, so a REFUSED run still hands over what it managed to write. A
      # refusal is exactly when the rows are wanted.
      - name: The per-document rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts
          path: verdicts/
          if-no-files-found: warn
          retention-days: 14
