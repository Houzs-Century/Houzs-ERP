name: Repair 2990 doc references (DRY-RUN gated)

# Tier 0 of the 2990-import reference repair. The importer prefixed document
# numbers but not the two references stored as free text inside another column
# (purchase_orders.notes "From SOs: …", and batch_no on inventory_lots +
# inventory_movements), so those name PRE-IMPORT numbers and every consumer's
# string equality fails.
#
# Part `consumptions` (2026-08-01, from the costing audit run 30694120826)
# extends the same rule to the ledger's OWN parent references:
# source_doc_no + source_doc_id on inventory_lot_consumptions and
# inventory_movements, doc types DO and GRN only. The id is written only from
# the same resolution the number rule proves; a stored id naming a DIFFERENT
# real document refuses the whole group. Its dry run also reports, read-only,
# the audit's 3a GRN line-vs-movement mismatches and any number-resolves-but-
# id-dangles rows, so the owner can classify them before anything is applied.
#
# Part `ids` (2026-08-01, ledger-perfection W1) is the id-heal for exactly
# those reported rows: when the NUMBER resolves to exactly ONE same-company
# document but the stored source_doc_id matches NOTHING (a verbatim-copied
# pre-import id), the id is restamped from that unique resolution — closing
# the costing audit's findings 4 and 10b. NULL ids are counted, never written.
#
# Part `grn-gap` (2026-08-01, ledger-perfection W2) repairs the audit's 3a
# finding: a posted GRN that accepted more units than its IN movements booked
# (2990-GRN-2606-001, 501 vs 500). It INSERTS the missing IN movement through
# the normal path — the AFTER-INSERT FIFO trigger opens the lot — into the
# bucket and at the landed unit cost its own sibling movement proves. The
# `grns` input names the target GRNs; anything ambiguous is refused.
#
# Part `dedupe` (2026-08-01, owner authorization "继续 全部可以" including
# removal): DELETE the movement+consumption pairs part `ids` classifies
# duplicate-of-real — only when the real document carries a FULL-ROW twin
# (same company, product, variant, warehouse, movement_type, qty). The delete
# reverses the duplicate's whole ledger effect in one transaction (consumed
# lots get their qty_remaining restored), prints every deleted row's old
# values in dry run AND apply, and prints the per-bucket movement-sum impact
# (duplicate OUTs double-decrement on-hand — the audit-2b linkage).
#
# Part `fifo-attribute` (2026-08-01, document-evidence round — owner rule
# "为什么要手动分配的 你根据FIFO 就没问题了啊？"): the contended consolidated-PO
# lines the pairing backfill refused are attributed automatically by FIFO —
# named SOs' free lines in computeMrp's deterministic order (delivery date
# ASC, doc_no ASC), PO lines in document order, quantity-aware (a qty-5 line
# splits; the remainder books as STOCK). Written as
# purchase_order_item_allocations rows (mig 0235, sub-numbers PO-xxxx-yy-NN)
# so the provenance is visibly "allocation" — never a fabricated so_item_id.
# The `pos` input names the target POs; idempotent (allocated lines skip).
#
# Part `so-warehouse` (2026-08-01, document-evidence round): the NULL-
# warehouse SO lines whose header resolves nothing get warehouse_id stamped
# from document evidence — the line's own DO OUT movement, else unanimous
# sibling agreement, else the company's single active warehouse; everything
# else reported needs-owner. Company-2990 rows are mirror-maintained
# (so-mirror.ts drains DELETE-then-INSERT), so they are REPORTED with the
# exact 2990-side fix and never written here.
#
# Part `do-line-link` (2026-08-01, trace-check class no-do-line-link): the
# DELIVERED SO lines whose SO has DOs but no DO line carries their so_item_id
# (old convert path / import). Within one SO and its own non-cancelled DOs, an
# unlinked DO line whose item code names EXACTLY ONE still-unlinked SO line
# stamps it (split deliveries allowed when the total fits); two candidate SO
# lines refuse. Completes the delivered trace for those lines.
#
# Part `fifo-attribute-repair` (2026-08-02, the 023/024 incident): re-evaluate
# EXISTING purchase_order_item_allocations against the delivered chain. A PO
# confirmed an UNEXECUTED duplicate of an executed same-supplier multiset twin
# has its allocation rows REMOVED entirely and the run prints a cancel
# recommendation (owner decision — never executed here). Otherwise rows whose
# so_item_id demand another PO's delivered chain fully served are flipped to
# so_item_id NULL (STOCK), each printed as
# `PO-xxxx-yy-NN: SO-zzz -> STOCK (served by ... via DO-...)`. The `pos`
# input names the target POs. Source-verdict addendum: a CANCELLED PO (023
# was cancelled in the SOURCE system; the import carried it) has its rows
# removed with NO cancel recommendation — nothing to cancel, and MRP was
# never inflated (CANCELLED is PO_DEAD). Import drift (status not CANCELLED
# where the verdict says it should be) is reported, never written.
#
# Part `service-lot-reverse` (2026-08-02, SELF-CAUGHT regression of grn-gap):
# the 2990-GRN-2606-001 APPLY counted the SVC-TRANS.CHARGES freight line into
# accepted qty and inserted a phantom 1-unit IN movement + lot for a SERVICE
# (the app never stocks service lines; goods accepted = 500 exactly). This
# part DELETES that movement + lot in one transaction — guarded: IN +
# service-coded product only, lot untouched (received == remaining), ZERO
# consumptions on lot AND movement; anything else refuses with the facts.
# The planner and the costing audit's 3a lens now exclude service lines, so
# the class cannot recur. Inputs `reverse_movement_id` / `reverse_lot_id`
# default to the incident rows.
#
# A token is rewritten ONLY when it resolves to nothing as stored, resolves to
# exactly ONE document when prefixed with the owning row's own company code, and
# that document belongs to the same company. Doc-number tails collide across
# company namespaces (PO-2607-002 and 2990-PO-2607-002 are both real), so a
# blanket prefix would repoint a batch at a different real purchase order.
#
# DRY-RUN unless apply=1. Idempotent: a repaired reference resolves (and a
# repaired GRN's delta recomputes to zero), so a re-run plans zero rows. Run
# the dry run, read the plan, then run again with apply=1. `all` still means
# the three ORIGINAL parts; `ids`, `grn-gap`, `dedupe`, `fifo-attribute` and
# `so-warehouse` are dispatch-only on purpose — the widest-reaching writes
# each get an explicit, single-purpose run.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "1 to write, anything else DRY-RUN"
        required: false
        default: "0"
        type: string
      part:
        description: "which reference to repair"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - notes
          - batches
          - consumptions
          - ids
          - grn-gap
          - dedupe
          - fifo-attribute
          - fifo-attribute-repair
          - so-warehouse
          - do-line-link
          - service-lot-reverse
      grns:
        description: "part grn-gap only: comma-separated GRN numbers (default the 3a-implicated one)"
        required: false
        default: "2990-GRN-2606-001"
        type: string
      pos:
        description: "parts fifo-attribute / fifo-attribute-repair: comma-separated PO numbers (default the two contended consolidated POs; the repair part re-evaluates their existing allocations)"
        required: false
        default: "2990-PO-2606-019,2990-PO-2606-023"
        type: string
      reverse_movement_id:
        description: "part service-lot-reverse only: movement id to delete (default the 2990-GRN-2606-001 phantom)"
        required: false
        default: "205e9f06-a5a3-4b04-bc60-47ba469cb547"
        type: string
      reverse_lot_id:
        description: "part service-lot-reverse only: lot id to delete (default the 2990-GRN-2606-001 phantom)"
        required: false
        default: "d264f343-5657-4318-876f-01bce3d84717"
        type: string

concurrency:
  group: repair-2990-doc-refs
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/repair-2990-doc-refs.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          PART: ${{ inputs.part }}
          GRNS: ${{ inputs.grns }}
          POS: ${{ inputs.pos }}
          REVERSE_MOVEMENT_ID: ${{ inputs.reverse_movement_id }}
          REVERSE_LOT_ID: ${{ inputs.reverse_lot_id }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first
