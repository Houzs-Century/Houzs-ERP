# BROKEN, AND A TRAP FOR ANYONE COPYING IT — 2026-08-13
#
# This workflow references SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY. Neither
# secret exists in this repository: not at repo level, not in Production, not
# in Staging. It has therefore never run and cannot run as written.
#
# It is also named three characters away from "recompute-so-allocation.yml",
# which DOES work — that one reaches the same Worker-side function through
# backend/scripts/lib/pgrest-shim.mjs over DATABASE_URL, the credential every
# other workflow here uses. A new workflow was written by copying THIS file and
# failed on its first dispatch with both secrets empty.
#
# To fix: swap the two secrets for DATABASE_URL and build the client with
# pgrestShim, exactly as recompute-so-allocation.mjs does. Left unfixed here
# only because that script is untested from this side; see CLAUDE.md, "Never
# ask the owner to run a query".
name: Recompute 2990 SO stock allocation (DRY-RUN gated)

# One-shot sweep for migrated 2990 Sales Orders (company_id = 2) whose stock
# allocation was never computed on import, so their Stock columns are blank.
# APPLY runs the CANONICAL recomputeSoStockAllocation (the same function every
# GRN / DO / return triggers) - reuse, not a re-implementation. Idempotent;
# DRY-RUN unless apply=1.
#
# Access path: the recompute talks to Supabase via PostgREST, so this uses the
# REST creds SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (schema `scm`), NOT the pg
# DATABASE_URL. Those are Worker secrets today; they must also exist as GitHub
# Actions secrets for this workflow to run.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "1 to write, anything else DRY-RUN"
        required: false
        default: "0"
        type: string

concurrency:
  group: recompute-2990-so-allocation
  cancel-in-progress: true

jobs:
  recompute:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/recompute-2990-so-allocation.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: ${{ inputs.apply }}
          NODE_OPTIONS: --dns-result-order=ipv4first
