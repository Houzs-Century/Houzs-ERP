name: Open AutoCount supplier 400-Z003 (plan by default)

# AutoCount PO-010113 names CreditorCode 400-Z003 (ZOE HOME SDN BHD), which is
# absent from scm.suppliers, so import-ac-outstanding-po.mjs skips the whole
# document on every go-live run. This opens the supplier from the book's own
# creditor record.
#
# PLAN BY DEFAULT. Writing needs mode=apply AND the confirm phrase, which is
# typed on purpose so an apply cannot happen by copying a command.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (default) or apply"
        required: false
        default: "plan"
      confirm:
        description: 'Required for apply: 400-Z003 ZOE HOME'
        required: false
        default: ""
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"

concurrency:
  group: open-ac-supplier-400-z003
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/open-ac-supplier-400-z003.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ inputs.mode }}
          CONFIRM_SUPPLIER: ${{ inputs.confirm }}
          COMPANY_ID: ${{ inputs.company_id }}
          NODE_OPTIONS: --dns-result-order=ipv4first
