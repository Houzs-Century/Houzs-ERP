name: DB view audit (read-only)

# TEMPORARY (audit/report-money-math branch only — reverted before the PR):
# repointed at scripts/check-report-money.mjs so the read-only report-money
# recompute can be dispatched before its own workflow file reaches main.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/check-report-money.mjs
        env:
          SECTION: autowhy,fairdoc,aging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
