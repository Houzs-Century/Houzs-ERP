name: Fix DIVAN GAP misparse (DRY-RUN gated)

# Corrects the mattress GAP on the three bedframe SO lines whose AutoCount Desc2
# wrote the divan height as "DIVAN GAP: N" ahead of the real "M.GAP" /
# "MATTRESS GAP", so the parser stamped the divan-gap figure as the mattress gap
# (GAP 8" instead of 12", T.Heights 16" instead of 20"). Owner-confirmed set:
# HC-SO-004193, HC-SO-010005, HC-SO-012921, plus each line's own DO / SI / PO /
# GRN snapshot. Merges into variants, never replaces; re-reads every row on a
# fresh connection and fails the job if a write did not land.
# See backend/scripts/fix-divan-gap-misparse.mjs.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "1 to WRITE. Anything else is a dry run."
        required: false
        default: ""
        type: string

concurrency:
  group: fix-divan-gap-misparse
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/fix-divan-gap-misparse.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          # GitHub-hosted runners have no IPv6 egress; mirror soak-gate/deploy so
          # an IPv4-only pooler host resolves.
          NODE_OPTIONS: --dns-result-order=ipv4first
