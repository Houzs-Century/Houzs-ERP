name: Roll up PO header total from its lines (go-live)

# The owner's ruling, 2026-09-08: recompute the header = add up the lines.
#
# 70 migrated purchase orders read RM 0.00 at the header while their own lines
# carry money (docs/bugs/0675-70-migrated-purchase-orders-*). The header
# faithfully copied AutoCount's own zero - Houzs does not price factory purchase
# orders in the book - and the ERP's LINE prices were set later by something
# other than the import, which never rolled back up.
#
# The roll-up rule is the app's own (`applyPoAmendment`,
# src/scm/lib/po-revision.ts): subtotal = SUM(line_total_sen), total = subtotal
# + tax. Rolling UP is not repricing: no line is written, and the verify re-reads
# every line on a fresh connection and asserts that not one price or quantity
# moved.
#
# CURRENCY. A purchase-order LINE has no currency column - it is stated in its
# document's currency by construction - so a document's own lines can never mix.
# Every figure printed is per-currency, nothing is ever compared against the
# book's local (MYR) netTotal, and a header with no currency is refused.
#
# PLAN is the default and writes nothing. apply needs the confirm phrase typed
# in full with the count THIS run measured.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      apply:
        description: "yes = write. Anything else = PLAN only."
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      confirm:
        description: 'Type ROLL UP <n> PURCHASE ORDER HEADERS with the count the plan printed. Ignored when apply=no.'
        required: false
        default: ""
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
        type: string

concurrency:
  group: rollup-po-header-total-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/rollup-po-header-total.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          COMPANY_ID: ${{ inputs.company_id }}
          OUT: ${{ runner.temp }}/po-header-rollup-dump.json
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/rollup-po-header-total.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          COMPANY_ID: ${{ inputs.company_id }}
          OUT: ${{ runner.temp }}/po-header-rollup-dump.json
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
