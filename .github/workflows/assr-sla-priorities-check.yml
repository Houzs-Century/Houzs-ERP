name: Service SLA priorities check (read-only)

# Answers "does making assr_priorities.sla_hours live change any deadline?"
# without anyone opening a SQL console.
#
# Until 2026-08-20 that column was saved by Service Maintenance and never read
# back, so its production values decided nothing. This PR makes them decide new
# case deadlines. Whether that MOVES anything depends on whether a manager ever
# edited a row away from the mig 065 seed — a fact that lives only in
# production, and one that reading code cannot answer.
#
# Manual trigger only. A production DB read on a schedule turns a real question
# into CI noise nobody reads.
on:
  workflow_dispatch:

# Deliberately NOT in the deploy concurrency group: this touches nothing and
# must never queue behind (or displace) a release.
concurrency:
  group: assr-sla-priorities-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-assr-sla-priorities.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first

      # Priority CHECK-constraint probe — the neighbouring question about the
      # same lookup table, and one that cannot be answered by reading code: does
      # public.assr_cases.priority still carry a CHECK admitting only the four
      # original slugs, so that a priority added in Service Maintenance is
      # offered by the picker and then refused by the database?
      #
      # It rides this workflow rather than a new one on purpose: a
      # workflow_dispatch file is only dispatchable once it is on the default
      # branch, so a brand-new workflow answers HTTP 404 until it merges — which
      # is exactly when the answer is still needed. Extending a workflow that is
      # already dispatchable lets `--ref <branch>` run THIS version of the file
      # before the PR lands. Same reasoning as do-integrity-check.yml.
      #
      # `if: always()` so the probe still reports when the step above fails.
      # They answer different questions and neither is a gate.
      - run: node scripts/check-assr-priority-constraint.mjs
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
