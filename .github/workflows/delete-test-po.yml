name: Delete test PO

# Deletes a single (test) Purchase Order + the rows it owns (lines, allocation
# slices, amendments, revisions, PO cancel requests). Refuses unless the PO is
# DRAFT or CANCELLED, if AutoCount still holds it, or if anything downstream
# names it (GRN, purchase invoice, return, stock, DO, journal). See
# backend/scripts/delete-test-po.mjs for the full safety contract.
#
# Run it as a DRY-RUN first — it prints every row it would touch. To apply,
# set apply=1 AND retype the PO number in confirm_doc; they must match exactly
# or the script refuses.
on:
  workflow_dispatch:
    inputs:
      doc_no:
        description: "The PO number to delete, without any _R suffix (e.g. HC-PO-2611-001)"
        required: true
      confirm_doc:
        description: "Retype the SAME PO number — required only when apply=1"
        required: false
        default: ""
      apply:
        description: "Set to 1 to DELETE (else dry-run report only)"
        required: false
        default: "0"
      target:
        description: "Destination DB"
        required: true
        default: "prod"
        type: choice
        options:
          - staging
          - prod

# Never queue behind — or displace — a release.
concurrency:
  group: delete-test-po
  cancel-in-progress: false

jobs:
  delete-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/delete-test-po.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DOC_NO: ${{ inputs.doc_no }}
          CONFIRM_DOC: ${{ inputs.confirm_doc }}
          APPLY: ${{ inputs.apply }}
          NODE_OPTIONS: --dns-result-order=ipv4first

  delete-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/delete-test-po.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOC_NO: ${{ inputs.doc_no }}
          CONFIRM_DOC: ${{ inputs.confirm_doc }}
          APPLY: ${{ inputs.apply }}
          NODE_OPTIONS: --dns-result-order=ipv4first
