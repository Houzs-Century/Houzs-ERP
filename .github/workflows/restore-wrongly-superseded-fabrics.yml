name: Restore the wrongly superseded fabrics

# Manual. MODE=plan (the default) writes NOTHING and IS the report: it counts
# the live document lines whose fabricCode no longer resolves to a tracking row,
# which is the price-tier join. MODE=apply needs the CONFIRM sentence.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      mode:
        description: "plan (default, writes nothing) | apply"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]
      company:
        description: "company_id"
        required: false
        default: "1"
        type: string
      all:
        description: "1 to ALSO revive the real merges (creates duplicate active codes - read the warning)"
        required: false
        default: "0"
        type: string
      confirm:
        description: 'apply only: I HAVE REVIEWED THE DRY-RUN'
        required: false
        default: ""
        type: string

concurrency:
  group: restore-wrongly-superseded-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/restore-wrongly-superseded-fabrics.mjs
        env:
          DATABASE_URL: ${{ inputs.target == 'prod' && secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          MODE: ${{ inputs.mode }}
          COMPANY: ${{ inputs.company }}
          ALL: ${{ inputs.all }}
          CONFIRM: ${{ inputs.confirm }}
