name: Where the live DB fixes the category list (read-only)

# TEMPORARY BRANCH BODY (probe branch only, never merged): code-bearing columns +
# Sofa Accessory lines with fabricCode. SELECT only.
on:
  workflow_dispatch: {}

concurrency:
  group: probe-category-constraints
  cancel-in-progress: false

jobs:
  prod:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/probe-code-columns-accessory-desc2.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OUT: probe-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: backend/probe-out
          retention-days: 3
