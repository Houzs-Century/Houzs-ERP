name: Where the live DB fixes the category list (read-only)

# TEMPORARY BRANCH BODY (reverted before merge): product code column snapshot.
on:
  workflow_dispatch: {}

concurrency:
  group: probe-category-constraints
  cancel-in-progress: false

jobs:
  prod:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/probe-product-code-columns.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-code-columns
          path: backend/product-code-columns.snapshot.json
          retention-days: 7
