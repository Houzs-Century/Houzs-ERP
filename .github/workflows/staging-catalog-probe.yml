name: Staging catalog probe (read-only)

# Answers, from the staging database itself, what preview branches left behind
# that main does not create: the tracker rows pg-migrate warns about, and the
# tables and columns they made, with a row count for each. A stray object is
# how staging could hide a production failure (a main migration that leans on
# it passes here and fails on prod), so the answer is the list. The previous
# question here (docs/bugs/0824, view read as service_role) is closed: the
# staging Worker's /health reports rest_role=service_role.
# One psql session, SELECTs only. Exit 0 for every legitimate answer; the
# answer is the output. Manual trigger only. Own concurrency group.

on:
  workflow_dispatch:

concurrency:
  group: staging-catalog-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Assert the target is STAGING
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          case "$DATABASE_URL" in *anogrigyjbduyzclzjgn*) echo "::error::points at PRODUCTION"; exit 1;; esac
          case "$DATABASE_URL" in *minnapsemfzjmtvnnvdd*) echo "target: staging";; *) echo "::error::not the staging project"; exit 1;; esac
      - name: List what preview branches left on staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -uo pipefail
          P=/usr/lib/postgresql/17/bin/psql
          "$P" "$DATABASE_URL" -v ON_ERROR_STOP=0 -X <<'SQL'
          \echo === tracker rows for the service-case preview migrations
          select filename, checksum, applied_at from _pg_migrations
           where filename like '2026110%assr%' or filename like '2026111%assr%' order by filename;
          \echo === tables: present on staging?
          select t.name, to_regclass('public.' || t.name) is not null as present
            from (values ('assr_return_dos'), ('assr_case_qc_notes')) t(name);
          \echo === columns: present on staging? (main creates none of these)
          select c.table_name, c.column_name, c.data_type from information_schema.columns c
           where c.table_schema = 'public'
             and ((c.table_name = 'assr_cases' and c.column_name in ('qc_inspected_at', 'qc_by', 'qc_findings'))
               or (c.table_name = 'assr_supplier_returns' and c.column_name = 'expected_return_at'))
           order by 1, 2;
          \echo === rows held in the stray objects
          select 'assr_return_dos' as obj, count(*) from public.assr_return_dos
          union all select 'assr_case_qc_notes', count(*) from public.assr_case_qc_notes
          union all select 'assr_cases with qc_* set', count(*) from public.assr_cases
           where qc_inspected_at is not null or qc_by is not null or qc_findings is not null
          union all select 'assr_supplier_returns with expected_return_at', count(*) from public.assr_supplier_returns
           where expected_return_at is not null;
          \echo === done
          SQL
          echo "probe finished (errors above are the answer, not a failure of the probe)"
