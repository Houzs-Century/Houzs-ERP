name: Copy each SO line unit price from AutoCount

# The migration rule is COPY THE BOOK (owner: 不是跟着 AutoCount 吗?) - and so is
# 空白不覆盖. Both apply, on different lines:
#
#   book states a price, ours differs   -> COPY
#   book states 0.00, ours has a price  -> LEAVE, and say so
#
# A sales order not in MYR is skipped wholesale: its amounts are not comparable,
# and reading one as a difference is what took RM 13,068.55 off a live purchase
# order (docs/bugs/0665, 0666).
#
# DRY-RUN unless apply=1.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      apply:
        description: "1 to WRITE. Anything else is a dry-run."
        required: false
        default: ""
      confirm:
        description: 'To WRITE, type exactly: I HAVE REVIEWED THE DRY-RUN'
        required: false
        default: ""

concurrency:
  group: repair-so-price-autocount-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/repair-so-price-from-autocount.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/repair-so-price-from-autocount.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
          NODE_OPTIONS: --dns-result-order=ipv4first
