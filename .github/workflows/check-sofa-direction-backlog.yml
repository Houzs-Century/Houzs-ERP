name: Sofa direction backlog (read-only)

# HOW MANY sofa builds still have to be re-read for direction, under the scope
# the owner set on 2026-09-10?
#
# The TV-direction round (docs/bugs/0774) corrected 20 documents out of 112 sofa
# lines that carried a drawing. The rest were reported as "~476 still to check",
# and the owner cut the scope:
#
#   你只需要看那些还没proceed的单就行了，后期的他们会跟 Supplier 拿那些 list，
#   因为 Supplier 那边是有记录到 by compartment 跟它的全部 variants 的
#
# A PROCEEDED order has gone to the supplier, and the supplier records the build
# by compartment with every variant - staff retrieve those. So the work we owe is
# the NOT-PROCEEDED half, and most of THAT is mirror-proof (both ends the same
# piece), which cannot be wrong either way and needs no drawing opened.
#
# SELECT only. No writes, no DDL, no transaction. Manual trigger only - a
# production DB read on a schedule turns a real query into CI noise nobody
# reads. Its own concurrency group, so a diagnostic never queues behind or
# displaces a release. Exit 0 for every legitimate answer.
#
# IT CORRECTS NOTHING. Which at-risk build is actually wrong is decided by the
# drawing and the TV in it, never by this script.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      company_id:
        description: "Company. Blank = 1."
        required: false
        default: ""
      list_limit:
        description: "At-risk documents to name. Blank = 60."
        required: false
        default: ""

concurrency:
  group: check-sofa-direction-backlog-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-sofa-direction-backlog.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          LIST_LIMIT: ${{ inputs.list_limit }}
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-sofa-direction-backlog.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          LIST_LIMIT: ${{ inputs.list_limit }}
          NODE_OPTIONS: --dns-result-order=ipv4first
