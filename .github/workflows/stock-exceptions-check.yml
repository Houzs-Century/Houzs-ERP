name: Stock exceptions check (read-only)

# Surfaces negative-stock buckets and movement-vs-lot disagreements, each
# LABELLED by cause, so the benign ship-anyway rows read as benign and only a
# real shortage stands out. Before this existed the only way to answer "which
# stock is negative and why?" was to hand-run a dozen SELECTs against the
# production pooler — an owner interruption that also put the DSN in front of a
# person. Actions already holds secrets.DATABASE_URL for the deploy, so the
# check runs here and nobody handles the credential.
#
# Manual trigger only — it is a question, not a gate, and a production DB read
# must never become part of routine scheduled CI noise.
on:
  workflow_dispatch:

# Deliberately NOT in the deploy concurrency group: this touches nothing and
# must never queue behind (or displace) a release.
concurrency:
  group: stock-exceptions-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-stock-exceptions.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning. Harmless on an IPv4-only host.
          NODE_OPTIONS: --dns-result-order=ipv4first
