name: SO amendment bound-PO reads check (read-only)

# Answers "can the PO Amendments queues silently lose their From SO amendment
# rows?" without anyone opening a SQL console.
#
# GET /so-amendments fills each row's bound_pos with three PostgREST reads whose
# id lists ride in the URL and whose answers were never paged, and both PO
# Amendments queues keep an SO amendment only when bound_pos is non-empty.
# Whether production is near a refused URL, a row ceiling or a cross-company
# link is a fact only production holds; this reads it with the deploy's
# DATABASE_URL inside a READ ONLY transaction and prints COUNTS and SIZES per
# company — the repository is public, so no SO number, id or name reaches the log.
#
# Manual trigger only: a question, not a gate.
on:
  workflow_dispatch:

# Deliberately NOT in the deploy concurrency group: this touches nothing and
# must never queue behind (or displace) a release.
concurrency:
  group: so-amendment-bound-po-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-so-amendment-bound-po-reads.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first
