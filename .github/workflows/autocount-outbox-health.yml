name: AutoCount write-back queue — health (read-only)

# Answers "is any document stuck in the ERP and not in AutoCount" without
# anyone opening a SQL console.
#
# The queue's only runtime output is a console.error inside a Worker, and a
# `failed` row means a document exists here and does not exist in the account
# book — the exact divergence the mechanism exists to prevent. This makes that
# visible to a human on demand.
#
# Manual trigger only. A production DB read on a schedule turns a real question
# into CI noise nobody reads, which is the standing rule in CLAUDE.md — and it
# would fire on every quiet day while the write-back is still switched off.
# When the sync is live and this needs to become an ALARM rather than a report,
# that is a different mechanism (somewhere a human actually looks), not a cron
# on this workflow.
on:
  workflow_dispatch:

# Deliberately NOT in the deploy concurrency group: this touches nothing and
# must never queue behind — or displace — a release.
concurrency:
  group: autocount-outbox-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-autocount-outbox-health.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first
