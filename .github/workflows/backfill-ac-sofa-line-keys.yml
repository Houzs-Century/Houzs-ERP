name: Backfill AutoCount line keys (SOFA, sales orders — plan by default)

# WHICH BOOK LINE IS THIS SOFA? — recorded, never guessed.
#
# A sofa is ONE line in the account book and SEVERAL rows in the ERP, one per
# compartment. `linked_ac_dtlkey` is the only thing that says which book line a
# set of compartments belongs to, and without it two things break at once:
#
#   · STAFF CANNOT EDIT THE ORDER. composeEdit accepts a build only when every
#     compartment agrees on the key (src/scm/lib/autocount-line-keys.ts:155), so
#     ONE keyless compartment costs the WHOLE document its line identity.
#   · THE RECONCILE CANNOT ANSWER IT. The compartment axis needs the whole build
#     regrouped, so an unkeyed sofa reads UNREAD - not agreeing, not differing.
#
# STAMPING A KEY IS NOT A COMPARTMENT DECISION. The owner's standing rule is
# 「一律跟账本。除了sofa compartment而已啊」 - only what the compartments ARE needs
# his judgement. Recording which book line rows already belong to needs no
# ruling; if the key then reveals a disagreement, that is REPORTED, never
# corrected here.
#
# PLAN IS THE DEFAULT AND WRITES NOTHING. It prints the whole population, every
# row it would stamp, and every document it REFUSES with the reason. A wrong
# DtlKey is strictly worse than none - migration 0273 states that AcSyncService
# then APPENDS a line to the live account book instead of editing the one that
# changed - so a refusal is the cheap outcome and a stamp is the expensive one.
#
# APPLY needs apply=yes AND the confirm phrase in full, AND the phrase is passed
# through to the script: a sibling workflow shipped without doing that and its
# apply path could never arm (docs/bugs/0700-the-backfill-workflow-never-passed
# -the-confirm-phrase-its-ow.md).
#
# SCOPE: sales orders, and only the SOFA builds on them. Purchase orders are
# this lane's CONTROL and are deliberately not touched. The non-sofa sales-order
# rows the same rule could force are counted in the plan and left for their own
# lane with their own before/after.
#
# The AutoCount side is the committed snapshot
# backend/scripts/data/ac-reconcile-truth.json.gz, re-cut on the office network
# with  AC_CRED_FILE=<path> node backend/scripts/export-ac-reconcile-truth.mjs
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      apply:
        description: "yes = WRITE. Anything else = PLAN only, which is the default."
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      confirm:
        description: 'Type STAMP SALES ORDER SOFA LINE KEYS to arm apply. Ignored when apply=no.'
        required: false
        default: ""
        type: string
      max_writes:
        description: "Refuse a plan wider than this many rows. Raise it only with the plan in front of you."
        required: false
        default: "400"
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
        type: string

# Its own group, never the deploy's. Not cancel-in-progress - cancelling an
# APPLY mid-write is the one thing worse than waiting.
concurrency:
  group: backfill-ac-sofa-line-keys-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    environment: Production
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/backfill-ac-sofa-line-keys.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          MAX_WRITES: ${{ inputs.max_writes }}
          COMPANY_ID: ${{ inputs.company_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/backfill-ac-sofa-line-keys.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          MAX_WRITES: ${{ inputs.max_writes }}
          COMPANY_ID: ${{ inputs.company_id }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
