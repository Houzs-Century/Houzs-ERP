name: Secret scan

# This repository is PUBLIC. A key, token or password committed here is
# readable by anyone the moment it is pushed, and deleting it in a later commit
# does not remove it from history. Nothing checked for that before this job.
#
# It scans the COMMITS a change adds, not the whole tree: on a PR, everything on
# the branch that is not yet on main; on main and in the merge queue, the range
# being added. The full history is scanned on manual dispatch; its known false
# positives are pinned in .gitleaksignore.
#
# A false positive in a new change: put `gitleaks:allow` in a comment on that
# line. Never add a real secret to an allowlist — rotate it, then remove it.
#
# gitleaks is downloaded at a pinned version and its tarball checked against the
# published SHA-256, so the scanner itself cannot change underneath us.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Pick the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="origin/${PR_BASE_REF}..HEAD" ;;
            merge_group)  range="${MG_BASE}..${MG_HEAD}" ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range="HEAD~1..HEAD"
              else
                range="${PUSH_BEFORE}..HEAD"
              fi ;;
            *) range="HEAD" ;;
          esac
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Scanning: $range ($(git rev-list --count $range) commits)"

      - name: Scan
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts="$RANGE"
