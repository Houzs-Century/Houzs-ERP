name: Staging E2E (smoke)

# Post-deploy end-to-end proofs against the STAGING stack. Encodes the lesson
# "deploy green + 200/401 = shipped, NOT working": every staging deploy is
# followed by three real browser proofs (login, SO list, company isolation).
#
# Deliberately NOT wired to `pull_request` and NOT a required check. An active
# merge train gates on "zero failed checks", so a flaky external-environment
# E2E must never sit on the critical path. Triggers instead are:
#   - workflow_run     -> runs automatically after "Deploy (Staging)" succeeds
#   - workflow_dispatch-> an operator can run it on demand from the Actions tab
#   - schedule         -> a nightly proof that staging still actually works
on:
  workflow_run:
    workflows: ["Deploy (Staging)"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 02:00 MYT nightly (UTC+8)

# One staging E2E run at a time — the specs share a single staging tenant and
# the isolation spec mutates the active-company key.
concurrency:
  group: staging-e2e
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # For a workflow_run trigger, only proceed when the deploy it followed
    # actually succeeded (no point smoke-testing a half-deployed staging).
    # workflow_dispatch and schedule have no upstream run and always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # A real assertion failure MUST surface red. The workflow stays non-required
    # (not on pull_request, not in branch protection), so red informs without
    # blocking the merge train.
    continue-on-error: false
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run executes from the default branch by default. Pin the
          # suite to the exact commit that Deploy (Staging) just shipped, or a
          # later main commit could make the smoke result describe different
          # source than the deployed frontend/Worker. Manual/nightly runs use
          # the event's own SHA.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json
      - run: npm ci
      # What build is this suite about to prove?
      #
      # On 2026-08-12 this workflow was found to have reported `success` every
      # night for two weeks against a staging stack last deployed 2026-07-29 —
      # 775 commits and 59 production migrations behind `main`. Every assertion
      # was true; none of them were about current code, and nothing in a green
      # run said so. See docs/staging-bench-rot-coe.md.
      #
      # This does NOT fail the run. The suite proves an ENVIRONMENT, and while
      # Deploy (Staging) is deliberately paused a red nightly would just be the
      # permanently-red workflow the pause was correct to remove. It makes the
      # answer carry its own subject: every green run now states the commit it
      # was green ABOUT.
      - name: Report which build staging is running
        shell: bash
        run: |
          api="${{ vars.STAGING_E2E_API_URL || 'https://autocount-sync-api-staging.houzs-erp.workers.dev' }}"
          tested="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          health=$(curl -fsS --max-time 20 "$api/health" || echo '{}')
          deployed=$(printf '%s' "$health" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')

          {
            echo "### Staging build under test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Worker \`/health\` | \`$health\` |"
            echo "| Deployed commit | \`${deployed:-unknown}\` |"
            echo "| Suite checked out | \`$tested\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$deployed" ]; then
            echo "::warning title=Staging build is unidentifiable::/health returned no GIT_SHA, so a green run here cannot say which commit it proved. Deploy (Staging) stamps it via --var GIT_SHA; if it is absent, staging has not been deployed by that workflow since the stamp was added."
          elif [ "$deployed" != "$tested" ]; then
            echo "::warning title=Staging is not running the commit this suite tested::deployed=$deployed tested=$tested. The assertions below are true about the DEPLOYED build, not about the checked-out source."
          fi
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
          # Optional overrides. Absent -> the suite uses the in-repo public
          # staging-seed account (hello@houzscentury.com). The required-proof
          # policy below fails when neither path authenticates.
          STAGING_E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          # A green automated smoke run must mean the authenticated proofs ran.
          # An unavailable DB/API or an unseeded fallback fixture fails red
          # instead of silently producing a green run with three skips.
          STAGING_E2E_REQUIRE_PROOF: "true"
          # Targets. The config bakes in the same defaults; these repo VARIABLES
          # let an operator re-point the suite (e.g. at a preview) without a code
          # change.
          STAGING_BASE_URL: ${{ vars.STAGING_E2E_BASE_URL || 'https://houzs-erp-staging.pages.dev' }}
          STAGING_API_URL: ${{ vars.STAGING_E2E_API_URL || 'https://autocount-sync-api-staging.houzs-erp.workers.dev' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 14
