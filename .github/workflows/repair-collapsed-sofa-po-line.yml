name: Repair a collapsed sofa purchase line (plan/apply)

# A sofa whose ERP PURCHASE side is one collapsed row (`8030-1S`) while its
# SALES side is decomposed (`8030-2A(LHF)` + `8030-1A(RHF)`) can never be linked
# at compartment grain, so the hard-bound sales line can never reach READY and
# the delivery order is refused - 「barang sudah ready」 notwithstanding.
#
# This gives the purchase row the compartments the BOOK'S OWN Desc2 states, and
# dedicates each one to the sales compartment of the same product. It is a copy
# witnessed twice: the book names the edge (PODTL.FromSODtlKey), the book's
# purchase text decodes to the build, and the sales side - decoded separately at
# import from the book's sales text - already holds it. Anything else is
# REFUSED and counted, never reconciled.
#
# NOTHING IS DELETED and the money does not move: the re-coded row's money
# columns are not written at all, every inserted piece has each `_sen` column at
# 0, and the purchase order's total is asserted before and after inside the same
# transaction. No outbox row is written and no AutoCount call is made.
#
# PLAN is the default and writes nothing; the plan is also the census, so it is
# the before AND the after measurement. APPLY additionally needs the confirm
# phrase.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (writes nothing) or apply"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]
      confirm:
        description: 'On apply only: I HAVE REVIEWED THE DRY-RUN'
        required: false
        default: ""
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
        type: string
      doc:
        description: "Optional single sales-order or purchase-order number, to rehearse one build"
        required: false
        default: ""
        type: string
      top:
        description: "Max rows printed per list"
        required: false
        default: "80"
        type: string
      max_snapshot_age_days:
        description: "Refuse if the AutoCount snapshot is older than this many days"
        required: false
        default: "2"
        type: string

# Its own group: a repair must never queue behind - or displace - a release.
concurrency:
  group: repair-collapsed-sofa-po-line
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/repair-collapsed-sofa-po-line.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          COMPANY_ID: ${{ inputs.company_id }}
          DOC: ${{ inputs.doc }}
          TOP: ${{ inputs.top }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first
