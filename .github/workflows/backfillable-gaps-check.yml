name: Backfillable gaps sweep (read-only)

# Ledger-perfection W6 (owner ask 2026-08-01: "看一下还有什么数据可以去补的").
# Seven read-only sections, each ending in a judgement — fillable-provable /
# fillable-needs-owner / leave-alone — with the exact evidence a gated backfill
# would copy:
#   1. SO lines with NULL warehouse (does the header still resolve one?)
#   2. DO headers missing so_doc_no (provable from the lines' so_item_id)
#   3. missing delivery dates the MRP page drops as UNDATED
#   4. mfg_products with NULL category (+ the enum-cast trap class)
#   5. posted GRNs with unbilled lines (reconcile against the accepted set)
#   6. SO lines with NULL line_no in mixed docs / NULL variants a DO disproves
#   7. bare-number references in columns the importer never prefixed
#
# SELECT only — no writes, no transaction, no schedule (a production read is a
# decision, not CI noise). Own concurrency group. Exit 0 for every legitimate
# answer; the output IS the answer.
on:
  workflow_dispatch:

concurrency:
  group: backfillable-gaps-check
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-backfillable-gaps.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
