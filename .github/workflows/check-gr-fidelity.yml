name: Goods receipt fidelity check (read-only)

# Answers the owner's question of 2026-09-07, asked before tallying stock
# against AutoCount: "可是 DO GR 你都检查对了？"
#
# The delivery order half was already answered by the AutoCount/ERP reconcile.
# The goods receipt half was NOT: check-migration-fidelity.mjs prints "line and
# money comparison NOT APPLICABLE" for the GR section and stops, and that was
# then read as "checked". This workflow compares the contents of the migrated
# goods receipts against the AutoCount book on the axes the export can support,
# and names the axes it cannot.
#
# READ-ONLY: SELECT only, no writes, no DDL, no transaction.
#
# The AutoCount half is a committed snapshot: the AutoCount host sits behind
# ZeroTier on the office network and a GitHub runner cannot reach it. The check
# prints the snapshot's own timestamp, so a stale export is visible rather than
# silently compared.
#
# Manual trigger only. A production read must never become routine CI noise.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      top:
        description: "Example rows printed per finding"
        required: false
        default: "25"

# Deliberately NOT the deploy's concurrency group: a diagnostic must never queue
# behind, or displace, a release.
concurrency:
  group: check-gr-fidelity-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-gr-fidelity.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          TOP: ${{ inputs.top }}
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-gr-fidelity.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOP: ${{ inputs.top }}
          # GitHub-hosted runners have no IPv6 egress.
          NODE_OPTIONS: --dns-result-order=ipv4first
