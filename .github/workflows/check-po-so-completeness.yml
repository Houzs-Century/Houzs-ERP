name: TEMP read-only DRY-RUN of repair-migrated-po-lines (throwaway ref)

# THROWAWAY. This file exists only on a temporary ref so that a read-only
# DRY-RUN of repair-migrated-po-lines.mjs can be dispatched at all: GitHub
# refuses workflow_dispatch for a workflow file that is not on the default
# branch, and repair-migrated-po-lines.yml is what PR #1905 introduces.
# It borrows the FILE NAME of an existing read-only audit purely so the
# dispatch resolves; main's copy of that file is untouched.
# There is no apply input. APPLY is never set, so the script cannot write.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]

concurrency:
  group: tmp-po-repair-dryrun-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/repair-migrated-po-lines.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
