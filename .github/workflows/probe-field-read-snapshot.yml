# Read-only. Asks WHY the full tally refuses with "the field query returned
# 15258 ERP lines but COUNT(*) says 15264" — a row cap, or a read whose two
# statements never shared one snapshot. The guard that produced that refusal is
# correct and is not touched; this only names the cause so the fix is the right
# one. SELECTs only, and the single transaction it opens is declared READ ONLY.
name: probe-field-read-snapshot

on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"

# Its OWN group. Other lanes are working this database; a diagnostic must never
# cancel somebody else's production run.
concurrency:
  group: probe-field-read-snapshot
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Which cause?
        run: node scripts/probe-field-read-snapshot.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          NODE_OPTIONS: --dns-result-order=ipv4first
