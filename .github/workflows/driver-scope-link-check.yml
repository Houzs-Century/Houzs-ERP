name: Driver scope link check (read-only)

# Answers "is the per-driver delivery board actually scoped, or has it been
# failing open to everyone-sees-everything?" without anyone opening a SQL console.
#
# resolveDeliveryScope narrows a restricted transportation caller through
# scm.drivers.user_id / scm.helpers.user_id, and fails OPEN on any error — which
# is deliberate. But no migration in this repo creates that column, and mig 0066
# refers to it as "0060's", while 0060 here is something else entirely. So the
# feature is either live, inert-because-empty, or has never run once. Only
# production can say which.
#
# Manual trigger only — it is a question, not a gate. A production DB read on a
# schedule turns a real answer into CI noise nobody reads.
on:
  workflow_dispatch:

# Deliberately NOT the deploy's concurrency group: this touches nothing and must
# never queue behind, or displace, a release.
concurrency:
  group: driver-scope-link-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-driver-scope-link.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml for
          # the full Happy-Eyeballs reasoning. Harmless on an IPv4-only host.
          NODE_OPTIONS: --dns-result-order=ipv4first
