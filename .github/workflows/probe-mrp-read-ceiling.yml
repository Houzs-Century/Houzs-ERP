# Read-only. Measures the PostgREST page ceiling at the REST edge (GETs only) and
# counts the rows every computeMrp read would return, so the cost of paging them
# is a measured number rather than an estimate. Writes nothing.
name: probe-mrp-read-ceiling

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      company:
        description: "Company id (1 = HOUZS, 2 = 2990)"
        required: false
        default: "1"
        type: string

concurrency:
  group: probe-mrp-read-ceiling
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/probe-mrp-read-ceiling.mjs
        env:
          COMPANY: ${{ inputs.company }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    # SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are Production-environment secrets,
    # not repo-level ones — without this the REST half of the probe silently
    # skipped (run 31941352447) because both came through as empty strings.
    environment: Production
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/probe-mrp-read-ceiling.mjs
        env:
          COMPANY: ${{ inputs.company }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
