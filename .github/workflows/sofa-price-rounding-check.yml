name: Sofa price rounding check (read-only)

# Answers "does the sofa engine's whole-ringgit rounding actually bite on live
# data?" without anyone opening a SQL console.
#
# The sofa pricing engine persists Math.round(sen / 100) as the selling price,
# so a module priced RM1,299.50 bills RM1,300.00. Whether that has ever HAPPENED
# depends on rows that exist only in production. Actions already holds
# secrets.DATABASE_URL for the deploy, so the check runs here and nobody has to
# handle the credential.
#
# Manual trigger only — it is a question, not a gate. A production DB read on a
# schedule turns a real answer into CI noise nobody reads.
on:
  workflow_dispatch:

# Deliberately NOT the deploy's concurrency group: this touches nothing and must
# never queue behind, or displace, a release.
concurrency:
  group: sofa-price-rounding-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-sofa-price-rounding.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml for
          # the full Happy-Eyeballs reasoning. Harmless on an IPv4-only host.
          NODE_OPTIONS: --dns-result-order=ipv4first
