name: Warehouse check (read-only)

# Which warehouse is which, and what is standing in it?
#
# The owned/held/display presentation work turns on two flags that are NOT the
# same thing: warehouses.is_consignment (a property of the PLACE) and the lot's
# source (a property of the GOODS). They are deliberately independent, so one
# warehouse can hold both. This lists both, per warehouse, from the live data.
on:
  workflow_dispatch:

concurrency:
  group: warehouses-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-warehouses.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
