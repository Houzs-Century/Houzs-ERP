name: MRP supplier map loss (read-only)

# Manual, read-only. Answers "does MRP's OWN supplier read lose a bound SKU?" by
# reading the FROZEN OUTPUT of the engine — scm.mrp_snapshots.result, which the
# Worker writes every ~15 minutes through the real supabase-js/PostgREST
# transport — and comparing, per item code, the suppliers the engine attached
# against the bindings that exist.
#
# Why this row and not a re-run of the query: this repository holds no PostgREST
# credential (SUPABASE_SERVICE_ROLE_KEY must never become an Actions secret here
# — the repo is public), so the snapshot is the only way to see what MRP's read
# actually produced at the edge. docs/bugs/0777 settled its own question the same
# way. The Sofa TAB computes live rather than reading this row, so the script
# says out loud that this is evidence about the ENGINE, not a recording of the
# owner's request.
#
# SELECTs only: no DDL, no writes, no transaction. Exits 0 for every legitimate
# answer including "no snapshot row" and "nothing is lost", because the ANSWER is
# the output and a red job reads as "the check broke".
on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "Company (1 = Houzs Century, 2 = 2990's Home)"
        required: false
        default: "1"
        type: string
      doc_nos:
        description: "Sales orders to print line by line, comma separated"
        required: false
        default: "HC-SO-013497,HC-SO-013495"
        type: string
      top:
        description: "How many codes to list per class"
        required: false
        default: "40"
        type: string

# Its own group — a diagnostic must never queue behind, or displace, a release.
concurrency:
  group: mrp-supplier-map-loss
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Report the supplier map
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          DOC_NOS: ${{ inputs.doc_nos }}
          TOP: ${{ inputs.top }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: npx tsx scripts/probe-mrp-supplier-map-loss.mjs
