name: check-hub-report-and-po-lock

# Read-only post-deploy proof for #5398 (health report to the IT Hub) and #5444
# (PO-raised edit lock on Houzs orders), issue #5459. Nobody has to log in.
# Prints counts and timestamps only: this repository is public.
# See backend/scripts/check-hub-report-and-po-lock.mjs.

on:
  workflow_dispatch: {}

concurrency:
  group: check-hub-report-and-po-lock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The Cloudflare token lives in the Production environment, not at repo level.
    environment: Production
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Which IT_HUB_* secrets the production Worker holds (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Names, never values: `secret list` cannot return a value. A failed list
        # is reported, not fatal, so the DB half still answers.
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no Cloudflare token in this job - configuration UNKNOWN from this step"; exit 0; fi
          if out=$(npx wrangler secret list --name autocount-sync-api --format json 2>/dev/null) && names=$(jq -er '.[].name' <<<"$out"); then
            echo "IT_HUB_* secret names on autocount-sync-api ($(wc -l <<<"$names") secrets in total):"
            grep '^IT_HUB_' <<<"$names" || echo "  (none)"
          else
            echo "secret list failed (token scope?) - configuration UNKNOWN from this step"
          fi
      - name: Read job_runs and the SO/PO chain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/check-hub-report-and-po-lock.mjs
