name: Reparent other income under 700-0000

# One-off repair (owner 2026-09-04: other income 挂在 700-0000; 530,592 都挂 other income). Manual.
# MODE=plan (the default) writes NOTHING — it lists, per company, which
# enumerated other-income roots would move under 700-0000. MODE=apply
# needs the CONFIRM sentence, exactly like every other repair workflow here.
# The script replicates chartUpdateHandler's reparent guards; see its header.
# Idempotent: a second apply matches zero rows.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "staging"
        type: choice
        options: [staging, prod]
      mode:
        description: "plan (default, writes nothing) | apply"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]
      confirm:
        description: 'apply only: I HAVE REVIEWED THE DRY-RUN'
        required: false
        default: ""
        type: string

concurrency:
  group: reparent-other-income-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The environment is the load-bearing line (docs/bugs/0629): secrets are
    # scope-resolved, and the REPO-scope STAGING_DATABASE_URL is a stale
    # prod-direct leftover. Mirror the pipelines that demonstrably connect:
    # Staging environment for staging, repo DATABASE_URL for prod.
    environment: ${{ inputs.target == 'prod' && 'Production' || 'Staging' }}
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/reparent-other-income.mjs
        env:
          DATABASE_URL: ${{ inputs.target == 'prod' && secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          # Runners have no IPv6 route to Supabase (0628).
          NODE_OPTIONS: --dns-result-order=ipv4first
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
