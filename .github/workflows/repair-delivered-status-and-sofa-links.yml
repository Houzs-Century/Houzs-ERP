name: Repair delivered status + sofa links

# Two cutover repairs the owner approved on 2026-09-09. Neither is a code
# defect; both are data the August cutover left behind.
#
#   CASE A  189 delivered sales-order lines still read PENDING. so-delivery-sync
#           is the only writer that lands a shipped line on READY and it fires on
#           a DO mutation; the cutover wrote its delivery orders straight into
#           the database, so it never fired. docs/bugs/0738 fixed the roll-up
#           that was reading the stale value; this fixes the value.
#   CASE B  HC-PO-009024's three sofa lines carry no link to HC-SO-012025, so
#           MRP keeps asking the buyer to order pieces that are already on order
#           and the sales line can never read READY.
#
# WHY A WORKFLOW AND NOT A LOCAL RUN. The desktop DSN is read-only by design
# (docs: the .db-align connection is for diagnosis). secrets.DATABASE_URL, which
# can write, exists only here. That split is the point: a production write goes
# through a dispatch with a confirm phrase, not through somebody's shell.
#
# DEFAULT IS PLAN. Running this with the defaults writes NOTHING and prints
# every row it would touch. Applying takes a deliberate mode change AND the
# confirm phrase, and the script refuses without it.
#
# REVERSAL. Both cases are uniform, so the undo needs no per-row lookup:
#   case A  UPDATE scm.mfg_sales_order_items
#              SET stock_status='PENDING', stock_qty_ready=0  WHERE id IN (...)
#           — every row in the population was PENDING with stock_qty_ready 0,
#             captured and verified before the first apply.
#   case B  UPDATE scm.purchase_order_items SET so_item_id=NULL WHERE id IN (...)
#           — all three were NULL.
# The id manifest is attached to the PR that added this workflow.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (default, writes nothing) or apply"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]
      confirm:
        description: "Required for apply: repair delivered status and sofa links"
        required: false
        default: ""
      only:
        description: "Limit to one case (A or B). Blank runs both."
        required: false
        default: ""

# Its own group: a repair must never queue behind, or displace, a release.
concurrency:
  group: repair-delivered-status-and-sofa-links
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    # Where DATABASE_URL lives — the same environment the deploy uses.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/repair-delivered-status-and-sofa-links.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          ONLY: ${{ inputs.only }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first
