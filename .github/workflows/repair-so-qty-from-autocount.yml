name: Copy each SO line quantity from AutoCount

# The migration rule is COPY THE BOOK (owner, 2026-09-07: 不是跟着 AutoCount 吗?).
# A line quantity that disagrees with AutoCount is why the document total
# disagrees with AutoCount, so the lines are fixed first and the totals follow.
#
# A line that has already been DELIVERED more than the book's quantity is NOT
# written - it is named in the log with its delivered quantity, for the owner.
#
# DRY-RUN unless apply=1.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      apply:
        description: "1 to WRITE. Anything else is a dry-run."
        required: false
        default: ""

concurrency:
  group: repair-so-qty-autocount-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/repair-so-qty-from-autocount.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/repair-so-qty-from-autocount.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          NODE_OPTIONS: --dns-result-order=ipv4first
