name: Purchase invoices without an AP journal (read-only)

# PR #5469 proved a purchase invoice can be POSTED while no supplier-debt (AP)
# journal is written, and that /from-grn and /from-grn-items post with no
# journal by construction. This counts how many such invoices production
# holds, per company, with total RM, creation path, likely reason, oldest and
# newest date, and the first 50 doc numbers.
#
# One SELECT, no writes. The verdict is the output; exit 0 for every answer.
on:
  workflow_dispatch:

concurrency:
  group: check-pi-without-ap-journal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-pi-without-ap-journal.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first
