name: Postsubmit

# Jobs that run AFTER merge, on main, instead of on every pull request.
#
# WHY THESE TWO AND NOT OTHERS. Measured over the last 40 ci.yml runs
# (2026-08-18), counting each job's own conclusion:
#
#   scale-postgres-contract   37 success   0 failure    <- moved here
#   frontend-perf             37 success   0 failure    <- moved here
#   backend-postgres          34 success   4 failure    <- STAYS in presubmit
#   file-size                          2 real findings  <- STAYS in presubmit
#
# A presubmit job earns its place by having caught something. These two never
# have: together they spent ~180 runner-seconds on every pull request to restate
# a result that has not changed in forty runs. On main they still run, still
# report, and still block nothing that was not already blocked - the repo
# ruleset requires only `backend-typecheck` and `frontend`.
#
# backend-postgres and file-size were candidates for this file and were kept in
# presubmit on purpose: both have real failures on the record (backend-postgres
# across several pg test files at once - a broken tree, not a flake), so moving
# them would have traded away the signal instead of the waste. Do not "finish
# the job" by relocating them here without new evidence.
#
# The `if:` guards these jobs carried in ci.yml (push / pull_request /
# merge_group) were dropped, not preserved: this workflow's own trigger is the
# guard now. That also means the merge-queue reasoning in their old comments no
# longer applies to them - see docs/ci-capacity-coe.md.
#
# If either job starts failing on main, that is the signal to move it back to
# presubmit, not to ignore it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: postsubmit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale-postgres-contract:
    # The full 100k evidence run is deliberately PR-only. GitHub emits both a
    # push and pull_request event for an open branch; running this job twice
    # would spend twice the time without adding an independent environment.
    #
    # `merge_group` is included because the merge queue is the tree that
    # actually reaches main, and a queue whose gate is weaker than the PR gate
    # is worse than no queue: it would let a change through on evidence
    # gathered against a different tree. Without this line the job simply never
    # runs once the queue is switched on — silently, since a job that does not
    # run reports nothing. See docs/ci-capacity-coe.md.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: houzs_scale_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d houzs_scale_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PERF_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/houzs_scale_test
      PERF_LOCAL_ACK: I_UNDERSTAND_THIS_IS_A_DISPOSABLE_LOCAL_DATABASE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Mark the ephemeral database as disposable
        run: >-
          node --input-type=module -e
          "import postgres from 'postgres';
          const sql = postgres(process.env.PERF_DATABASE_URL, { max: 1 });
          try { await sql.unsafe(\"COMMENT ON DATABASE houzs_scale_test IS 'HOUZS_DISPOSABLE_LOCAL_SCALE_V1'\"); }
          finally { await sql.end(); }"
      - name: Execute the full real-schema PostgreSQL scale fixture
        run: |
          mkdir -p artifacts
          npm run perf:scale -- --engine=pg --orders=100000 --lines=100000 --skus=10000 --users=10000 --runs=20 --json=artifacts/scale-pg-100k.json
      - name: Upload immutable scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-pg-100k-${{ github.sha }}
          path: backend/artifacts/scale-pg-100k.json
          if-no-files-found: error
          retention-days: 30

  frontend-perf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Non-skippable local Chromium proof for 10k list geometry/search state.
      # This suite starts its own Vite lab and never depends on staging data,
      # credentials, network timing, or optional environment variables.
      - run: npm run typecheck:perf-local
      # The browser is ~27s of download on every run and changes only when the
      # Playwright dependency does, so it is keyed on the lockfile.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # `--with-deps` installs OS packages too, and those are NOT in the cached
      # directory, so a cache hit still needs the system half.
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:perf-local

  # File-size ratchet. Cheap on purpose — no `npm ci`, no build, zero
  # dependencies — so adding it costs the queue a few seconds, not a runner
  # slot's worth of install. See scripts/lib/file-size-ratchet.mjs for the rules.
  #
  # This does NOT try to split the 39 files already over 2,000 lines. It records
  # what each one already is and refuses to let it grow, so the problem stops
  # getting worse while the refactors happen (or do not) on their own schedule.
