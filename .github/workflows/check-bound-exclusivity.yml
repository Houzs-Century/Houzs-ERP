name: Bound exclusivity census (read-only)

# Manual. Measures whether the owner's company-1 hard-binding rule is HELD by
# production data: every lit bedframe / sofa / (SP)-mattress line classified by
# what lit it (own received PO / sofa batch / nothing). SELECT only, no writes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]

concurrency:
  group: check-bound-exclusivity-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-bound-exclusivity.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-bound-exclusivity.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
