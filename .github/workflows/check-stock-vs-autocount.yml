name: Stock vs AutoCount reconcile (read-only)

# TEMPORARY, ON THIS BRANCH ONLY, AND REVERTED IN THE NEXT COMMIT.
#
# A workflow_dispatch workflow can only be dispatched if its file exists on the
# DEFAULT branch - the API returns 404 otherwise - but the file it RUNS is the
# one on the dispatched ref. check-migration-fidelity.yml is new and therefore
# unregistered, so this already-registered read-only prod reader is borrowed for
# one run to produce the evidence for PR #1981. Still SELECT-only, still manual.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      top:
        description: "How many rows to list per section"
        required: false
        default: "40"

concurrency:
  group: check-stock-vs-autocount-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-migration-fidelity.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOP: ${{ inputs.top }}
          NODE_OPTIONS: --dns-result-order=ipv4first
