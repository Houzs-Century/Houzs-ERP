name: apply-hookka-quotation

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Database"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      mode:
        description: "dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, apply]
      confirm:
        description: 'For apply: type exactly "I HAVE REVIEWED THE DRY-RUN"'
        required: false
        default: ""

concurrency:
  group: apply-hookka-quotation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run quotation refresh
        env:
          DATABASE_URL: ${{ inputs.target == 'prod' && secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: node scripts/apply-hookka-quotation.mjs
