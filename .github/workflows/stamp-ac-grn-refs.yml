name: Stamp AutoCount GR refs on imported POs

# Manual. Writes the AutoCount GR / Purchase Invoice document numbers onto the
# imported POs as a cross-reference. Reference ONLY: it creates no ERP goods
# received document and no stock movement, because the units are already in from
# the balance snapshot and a GRN would double-count them.
#
# The source is backend/scripts/data/ac-convert-edges.json.gz — the WHOLE book,
# unfiltered. It used to be ac-gr-refs.json.gz, which is cut against the POs that
# were outstanding on the day of the export, so a purchase order the book has
# since closed loses its receipts from the cut and this job could never stamp
# them. The script REFUSES on a snapshot older than max_snapshot_age_days rather
# than stamping a stale book onto a live tree.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      apply:
        description: "1 to write the references, else DRY-RUN"
        required: false
        default: "0"
        type: string
      company_id:
        description: "ERP company to stamp (AED_HOUZS is company 1)"
        required: false
        default: "1"
        type: string
      max_snapshot_age_days:
        description: "Refuse if ac-convert-edges.json.gz is older than this many days"
        required: false
        default: "3"
        type: string

concurrency:
  group: stamp-ac-grn-refs-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/stamp-ac-grn-refs.mjs
        env:
          APPLY: ${{ inputs.apply }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/stamp-ac-grn-refs.mjs
        env:
          APPLY: ${{ inputs.apply }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
