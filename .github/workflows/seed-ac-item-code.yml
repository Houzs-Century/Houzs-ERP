name: AutoCount item codes — seed ac_item_code

# Fills scm.supplier_material_bindings.ac_item_code (migration 0326) with the
# ItemCode the account book actually holds, by three named rules, and leaves
# anything it cannot decide as NULL with the row listed.
#
# DEFAULT IS plan: reads only, writes nothing, prints every decision and the
# rule that made it. apply needs the confirm phrase.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (default, read-only) or apply (WRITES ac_item_code)"
        type: choice
        default: plan
        options: [plan, apply]
      confirm:
        description: 'For apply ONLY, type exactly: SEED AUTOCOUNT ITEM CODES'
        type: string
        required: false
        default: ""
      rows_per_rule:
        description: "Example rows to print per rule (0 = all)"
        type: string
        required: false
        default: "6"

concurrency:
  group: seed-ac-item-code
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/seed-ac-item-code.mjs
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          ROWS_PER_RULE: ${{ github.event.inputs.rows_per_rule }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
