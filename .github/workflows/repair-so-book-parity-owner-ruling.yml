name: Owner delete ruling — SO book parity (plan by default)

# THE OWNER'S RULING OF 2026-09-08, EXECUTED ON THE TWO SALES ORDERS IT NAMES.
#
# He was shown the last three sales-order differences on the go-live reconcile
# and told that two of them needed his decision BECAUSE this repo's standing
# convention is NEVER DELETE, ONLY CANCEL. Knowing that, he answered:
#
#     「删掉啊 没写的也删掉
#       简单来说都要跟Autocount一样啊 你不懂吗？」
#
# That is an EXPLICIT, INFORMED override of the never-delete convention, for
# these rows and the class they belong to — NOT a general licence. The record is
# docs/modules/sales-order.md ("The owner's delete ruling") and docs/bugs/0712-the-owner-ruled-that-a-row-the-book-describes-nothing-in-is.md.
#
# TWO LANES, BOTH PER-DOCUMENT:
#   delete      HC-SO-013160's 4th row, STORAGE RM 300.00, claiming AutoCount
#               DtlKey 892917 — a key on NO document of any type in the whole
#               snapshot. The book has three lines totalling RM 300.00; we have
#               four totalling RM 600.00.
#   sofa-price  HC-SO-012571's sofa compartment, RM 3,388.00 against the book's
#               RM 3,300.00. The money stays on the SAME compartment it already
#               rides; only the number changes.
#
# PLAN IS THE DEFAULT AND WRITES NOTHING. It prints every ERP row of both
# documents beside the book's own lines, the whole list of tables whose rows can
# point at a sales-order line and how many actually point at the row to be
# deleted, EVERY COLUMN of that row as JSON so it can be re-created by hand, and
# what each header would read afterwards against the book. Run it, read it, then
# decide.
#
# APPLY DELETES A ROW FROM A LIVE CUSTOMER ORDER AND MOVES MONEY. A revert
# cannot undo a delete, which is why the row is captured in full first. It needs
# apply=yes AND the confirm phrase in full, and the phrase is passed through to
# the script — a sibling workflow shipped without doing that and its apply path
# could never arm (docs/bugs/0700).
#
# It does NOT touch paid_sen or the header balance_sen: both documents' totals
# FALL, and where that leaves total != paid + balance the document is NAMED for
# the owner rather than re-derived. It does NOT touch the AutoCount write-back
# (owner, same day: 「写回autocount的你不需要理了」) and the run PROVES that by
# counting scm.autocount_outbox for both documents before and after.
#
# The AutoCount side is the committed snapshot
# backend/scripts/data/ac-reconcile-truth.json.gz, re-cut on the office network
# with  AC_CRED_FILE=<path> node backend/scripts/export-ac-reconcile-truth.mjs
# The script REFUSES a snapshot older than max_snapshot_age_days rather than
# deleting a line on the strength of a stale book.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      apply:
        description: "yes = WRITE (this DELETES a line). Anything else = PLAN only, which is the default."
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      confirm:
        description: 'Type I HAVE REVIEWED THE OWNER DELETE RULING PLAN to arm apply. Ignored when apply=no.'
        required: false
        default: ""
        type: string
      lanes:
        description: "Which lanes to run: delete, sofa-price, or delete,sofa-price"
        required: false
        default: "delete,sofa-price"
        type: string
      only_docs:
        description: "Narrow the APPLY to these AutoCount document numbers (comma separated). The PLAN always covers both. Empty = no narrowing."
        required: false
        default: ""
        type: string
      max_writes:
        description: "Refuse an apply wider than this many line writes. Raise it only with the plan in front of you."
        required: false
        default: "2"
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
        type: string
      max_snapshot_age_days:
        description: "Refuse an AutoCount snapshot older than this many days."
        required: false
        default: "2"
        type: string

# Its own group, never the deploy's. Not cancel-in-progress — cancelling an
# APPLY mid-write is the one thing worse than waiting.
concurrency:
  group: repair-so-book-parity-owner-ruling-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    environment: Production
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/repair-so-book-parity-owner-ruling.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          LANES: ${{ inputs.lanes }}
          ONLY_DOCS: ${{ inputs.only_docs }}
          MAX_WRITES: ${{ inputs.max_writes }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/repair-so-book-parity-owner-ruling.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          LANES: ${{ inputs.lanes }}
          ONLY_DOCS: ${{ inputs.only_docs }}
          MAX_WRITES: ${{ inputs.max_writes }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
