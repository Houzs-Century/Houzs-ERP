name: SO list empty check (read-only)

# Answers the 2026-08-18 incident question — "does the data exist, and does the
# recreated mfg_sales_orders_with_payment_totals view return it, per company?" —
# without anyone opening a SQL console. Actions already holds
# secrets.DATABASE_URL for the deploy, so the check runs here and nobody handles
# the credential.
#
# Manual trigger only — it is a diagnostic, not a gate, and a production DB read
# must never run on a schedule that turns it into routine CI noise.
on:
  workflow_dispatch:

# Deliberately NOT in the deploy concurrency group: this touches nothing and
# must never queue behind (or displace) a release.
concurrency:
  group: so-list-empty-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-so-list-empty.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning. Harmless on an IPv4-only host.
          NODE_OPTIONS: --dns-result-order=ipv4first
