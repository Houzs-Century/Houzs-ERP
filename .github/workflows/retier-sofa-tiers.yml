name: retier-sofa-tiers

# Manual, and ONE-SHOT. Shifts the 2026-08 sofa price bands up one tier
# (P1->P2, P2->P3, old P3 retired), per the owner's "all of our normal price
# start from P2".
#
# RE-RUN: REFUSED, in both modes, once the combo batch has been shifted. The
# combo block shifts by POSITION, not by value, so a second pass would push the
# band the first pass promoted to P2 on to P3 and soft-DELETE the one it
# promoted to P3. The script now stops on its own if it finds a soft-deleted row
# in the 2026-08 combo batch. If it refuses and you believe the shift has not
# run, do not force it - find out who retired that combo first.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Database"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      mode:
        description: "dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, apply]

concurrency:
  group: retier-sofa-tiers
  cancel-in-progress: false

jobs:
  retier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Retier sofa tiers
        env:
          DATABASE_URL: ${{ inputs.target == 'prod' && secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          APPLY: ${{ inputs.mode == 'apply' && '1' || '' }}
        run: node scripts/retier-sofa-tiers.mjs
