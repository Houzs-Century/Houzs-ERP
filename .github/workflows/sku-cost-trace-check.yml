name: SKU cost trace check (read-only)

# Traces where one Sales Order's stamped per-line unit cost came from
# (product-master estimate vs FIFO lot vs GRN/PI landed cost, incl. the
# binding-currency no-conversion trap), for the owner's 2026-08-08 questions:
#   * 2990-SO-2608-008 "2990 KETTA-FIRM MATT (K)" costed RM2,567.60 vs sell
#     RM2,990.00 (86%) — which number fed it?
#   * 2990-SO-2607-019 (sofa) shows NO cost at all / margin 100% — which
#     source is empty, and is the zero the designed pre-delivery state?
#
# SELECTs only. Exit 0 for every legitimate answer; the output IS the answer
# (::notice:: lines on the run summary).
on:
  workflow_dispatch:
    inputs:
      so_doc_no:
        description: "Sales Order doc_no to trace"
        required: true
        default: "2990-SO-2608-008"
        type: string
      sku:
        description: "SKU free-text filter (matches item_code/description; empty = all goods lines)"
        required: false
        default: "KETTA"
        type: string

concurrency:
  group: sku-cost-trace-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-sku-cost-trace.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SO_DOC_NO: ${{ inputs.so_doc_no }}
          SKU: ${{ inputs.sku }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first
