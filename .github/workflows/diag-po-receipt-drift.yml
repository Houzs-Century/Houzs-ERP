name: Diag PO receipt drift

# READ-ONLY recurring probe: does every PO line's received_qty still agree with
# the GRN lines that received against it?
#
# This is a SCHEDULED job, not a workflow_dispatch one, because the failure it
# guards is silence. On 2026-07-31 eleven 2990 POs were found under-reporting
# receipts that had landed between 07-14 and 07-22 — the goods were in the
# warehouse, the GRNs were POSTED, and nothing anywhere said otherwise until an
# operator happened to open one order nine days later. A probe you have to
# remember to run would not have caught it either.
#
# The job FAILS (exit 1) when it finds drift, so a red run is the notification.
on:
  schedule:
    # 01:30 UTC = 09:30 MYT, daily — the buyers open the PO list on the back of
    # this, so a bad night is on screen before anyone acts on the numbers.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Destination DB"
        required: true
        default: "prod"
        type: choice
        options:
          - staging
          - prod

jobs:
  # The scheduled run only ever checks prod: staging's data is a load artefact,
  # and drift there says nothing about whether the buyers' list is honest.
  drift-prod:
    if: ${{ github.event_name == 'schedule' || inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/diag-po-receipt-drift.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  drift-staging:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/diag-po-receipt-drift.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
