name: Fair data gaps (read-only)

# Answers "what is still stopping a sales order from linking to its fair?"
# without anyone opening a SQL console.
#
# Three gaps, all of them owner decisions rather than script decisions: an
# organizer written two ways, a main product with no brand on it, and one booth
# entered into PMS twice. See backend/scripts/report-fair-data-gaps.mjs for why
# each one breaks the link and why this job refuses to fix any of them.
#
# Manual trigger only — it is a question, not a gate, and a production DB read
# must never become routine CI noise nobody reads.
on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company id (1 = Houzs Century, 2 = 2990's Home)"
        required: false
        default: "1"

# Deliberately NOT in the deploy concurrency group: this touches nothing and
# must never queue behind — or displace — a release.
concurrency:
  group: fair-data-gaps
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/report-fair-data-gaps.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY: ${{ inputs.company }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first
