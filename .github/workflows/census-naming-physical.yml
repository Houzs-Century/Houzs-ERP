name: Census — naming physical (read-only)

# Reads the SHAPE of the data behind the batch-3 physical naming unification, so
# the warehouse backfill and the customer-ref DROP are census-informed, not
# guessed. Reports, against LIVE prod:
#   A. WAREHOUSE — how many non-cancelled SOs carry a non-empty sales_location,
#      how many resolve to exactly one scm.warehouses row (code-then-name, same
#      company), and which do NOT resolve / resolve ambiguously.
#   B. CUSTOMER-REF — the fill count of po_doc_no / customer_po / customer_po_id /
#      customer_po_date, and every view/index/function/policy/constraint that
#      references them, plus each dependent view's OWNER + GRANTs (the 0189
#      view-grant restore payload).
# See backend/scripts/census-naming-physical.mjs. SELECTs only, no writes.
#
# Manual trigger only — a diagnostic question, never a scheduled production read.
on:
  workflow_dispatch: {}

# Own group, never the deploy's: it touches nothing and must not queue behind a
# release.
concurrency:
  group: census-naming-physical
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/census-naming-physical.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; mirror soak-gate/deploy so
          # an IPv4-only pooler host resolves.
          NODE_OPTIONS: --dns-result-order=ipv4first
