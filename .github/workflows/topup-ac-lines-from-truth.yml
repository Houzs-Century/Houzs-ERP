name: Top up book lines from the reconcile truth (plan by default)

# A LINE THE ACCOUNT BOOK HAS AND OUR DOCUMENT DOES NOT — added.
#
# The owner's standing ruling, 2026-09-08: 「一律跟账本。除了sofa compartment而已
# 啊」 — follow the account book for everything; only a sofa compartment needs
# his judgement, because the book's text cannot be decoded into pieces without
# the drawing. So where the book holds a line and the ERP does not, adding it is
# already decided.
#
# WHY NOT "Top up migrated SO lines from AutoCount" (topup-ac-so-lines.yml).
# That one reads the OUTSTANDING cut, which carries ZERO lines for a document
# delivered since the import — six sales orders sat in that blind spot
# (docs/bugs/0694, section A of docs/cutover-so-do-remainder-2026-09-08.md).
# This one reads backend/scripts/data/ac-reconcile-truth.json.gz, the whole
# book, and takes its population from what the ERP actually holds. It also
# writes a PRICED line, which the older tool refuses by design, because it
# re-sums the header and the five category buckets from the lines — the same
# write repair-so-line-discount.mjs performs.
#
# PLAN IS THE DEFAULT AND WRITES NOTHING. It prints, per document, every ERP row
# and every book line, what it would add, what the header would read afterwards
# against the book, every line it REFUSES and why, and every ERP row the book
# does not have (reported, NEVER deleted — this repo cancels, it does not
# delete). Run it, read it, then decide.
#
# APPLY MOVES MONEY ON LIVE CUSTOMER ORDERS. It needs apply=yes AND the confirm
# phrase in full, and the phrase is passed through to the script — a sibling
# workflow shipped without doing that and its apply path could never arm
# (docs/bugs/0700).
#
# It does NOT touch paid_sen or the header balance_sen: what a customer paid is
# a fact about the business, not an arithmetic consequence, and a document left
# inconsistent by a corrected total is NAMED for the owner.
#
# The AutoCount side is the committed snapshot
# backend/scripts/data/ac-reconcile-truth.json.gz, re-cut on the office network
# with  AC_CRED_FILE=<path> node backend/scripts/export-ac-reconcile-truth.mjs
# The script REFUSES a snapshot older than max_snapshot_age_days rather than
# writing lines against a stale book.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]
      apply:
        description: "yes = WRITE. Anything else = PLAN only, which is the default."
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      confirm:
        description: 'Type I HAVE REVIEWED THE BOOK LINE TOP-UP PLAN to arm apply. Ignored when apply=no.'
        required: false
        default: ""
        type: string
      lanes:
        description: "Which lanes to run: so, do, or so,do"
        required: false
        default: "so,do"
        type: string
      only_docs:
        description: "Narrow the APPLY to these AutoCount document numbers (comma separated). The PLAN always covers the whole population. Empty = no narrowing."
        required: false
        default: ""
        type: string
      max_writes:
        description: "Refuse an apply wider than this many lines. Raise it only with the plan in front of you."
        required: false
        default: "25"
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
        type: string
      max_snapshot_age_days:
        description: "Refuse an AutoCount snapshot older than this many days."
        required: false
        default: "2"
        type: string
      top:
        description: "How many rows to list per refusal section"
        required: false
        default: "60"
        type: string

# Its own group, never the deploy's. Not cancel-in-progress — cancelling an
# APPLY mid-write is the one thing worse than waiting.
concurrency:
  group: topup-ac-lines-from-truth-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    environment: Production
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/topup-ac-lines-from-truth.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          LANES: ${{ inputs.lanes }}
          ONLY_DOCS: ${{ inputs.only_docs }}
          MAX_WRITES: ${{ inputs.max_writes }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          TOP: ${{ inputs.top }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml.
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/topup-ac-lines-from-truth.mjs
        env:
          MODE: ${{ inputs.apply == 'yes' && 'apply' || 'plan' }}
          CONFIRM: ${{ inputs.confirm }}
          LANES: ${{ inputs.lanes }}
          ONLY_DOCS: ${{ inputs.only_docs }}
          MAX_WRITES: ${{ inputs.max_writes }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          TOP: ${{ inputs.top }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
