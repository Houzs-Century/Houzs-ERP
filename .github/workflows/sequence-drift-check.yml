name: Sequence drift check (read-only)

# Answers "why can't anyone create a project?" without opening a SQL console.
#
# Every id column in the projects schema is GENERATED BY DEFAULT AS IDENTITY,
# so a bulk copy that carries its own ids leaves the sequence pointing at
# numbers already in the table — silently. The next New Project click then dies
# on duplicate key behind a generic "Something went wrong". That happened on
# 2026-08-21 and again on 2026-08-24, and both times the diagnosis was the
# expensive part, not the fix.
#
# Manual trigger only. A production DB read must never become routine CI noise
# on a schedule.
on:
  workflow_dispatch:

# Deliberately NOT in the deploy concurrency group: this touches nothing and
# must never queue behind — or displace — a release.
concurrency:
  group: sequence-drift-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-sequence-drift.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first
