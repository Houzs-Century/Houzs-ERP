name: Sofa code vs description (read-only)

# Sofa lines whose ITEM CODE and DESCRIPTION disagree about the piece.
#
# The owner, 2026-09-10, on HC-SO-012016: 「为什么外面2AR 里面2AL？」 - the order
# list shows one hand, the edit form shows the other, and he is about to raise a
# purchase order off one of them. Read from production, both screens are right
# and the ROW is self-contradictory: item_code 9028-2A(RHF) with the description
# "SOFA VERANO 2A(LHF)". A hand was swapped in one column and not the other.
#
# Counts the HAND disagreement apart from a piece disagreement, and both apart
# from rows where one side simply states no hand - so the headline is not
# inflated by rows with nothing to compare. Runs on the sales order, the
# PURCHASE order (what the factory reads) and the delivery order.
#
# Both columns are read by ONE reader, so a difference cannot come from two
# readers disagreeing, and both readers self-test at startup and refuse to
# report rather than report from a dead match.
#
# SELECT only. Manual trigger. Own concurrency group. Exit 0 for every answer.
# It decides nothing about which side is right.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which DB"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]
      company_id:
        description: "Company. Blank = 1."
        required: false
        default: ""
      tables:
        description: "SO,PO,GR,DO - which document types. Blank = all four."
        required: false
        default: ""
      list_limit:
        description: "Rows to name per table. Blank = 60."
        required: false
        default: ""

concurrency:
  group: check-sofa-code-vs-description-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: Staging
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-sofa-code-vs-description.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          LIST_LIMIT: ${{ inputs.list_limit }}
          TABLES: ${{ inputs.tables }}
          NODE_OPTIONS: --dns-result-order=ipv4first

  run-prod:
    if: ${{ inputs.target == 'prod' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-sofa-code-vs-description.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          LIST_LIMIT: ${{ inputs.list_limit }}
          TABLES: ${{ inputs.tables }}
          NODE_OPTIONS: --dns-result-order=ipv4first
