name: Local dev snapshot (prod -> masked, encrypted artifact)

# A full copy of production (public + scm, schema AND data) for a developer's
# local Postgres, without the production password ever leaving GitHub.
#
#   1. pg_dump production, read-only (Production environment, DATABASE_URL).
#   2. Restore into a throwaway postgres:17 service on the runner (same vanilla
#      Postgres a laptop runs, so restore problems show here first).
#   3. Mask every customer phone / mobile / email column there - the same rule
#      as staging-refresh-data.yml (staff login emails kept so login works).
#   4. pg_dump the MASKED copy and encrypt it to the requester's RSA public key
#      (input). Only the machine holding the private key can open the artifact,
#      so repo readers who can download artifacts get ciphertext.
#
# The unmasked dump never leaves the runner. Manual trigger only. Writes nothing
# to production or staging. RE-RUN: safe any time; each run is independent.

on:
  workflow_dispatch:
    inputs:
      recipient_pubkey:
        description: "Base64 (one line) of the requester's RSA public key PEM"
        required: true
        type: string

concurrency:
  group: local-dev-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LOCAL: postgresql://postgres:local@localhost:5432
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Check the recipient key before touching production
        env:
          PUBKEY_B64: ${{ inputs.recipient_pubkey }}
        run: |
          set -euo pipefail
          echo "$PUBKEY_B64" | base64 -d > recipient.pem
          openssl pkey -pubin -in recipient.pem -noout -text | head -1

      - name: Assert the source is PRODUCTION
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          case "$DATABASE_URL" in
            *anogrigyjbduyzclzjgn*) echo "source: production (anogrigyjbduyzclzjgn)";;
            *) echo "::error::DATABASE_URL is not the production project - refusing"; exit 1;;
          esac

      - name: Dump production public + scm (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -At -c "select e.extname || '|' || n.nspname from pg_extension e
            join pg_namespace n on n.oid = e.extnamespace where e.extname <> 'plpgsql' order by 1" > extensions.txt
          echo "production extensions:"; sed 's/^/  /' extensions.txt
          pg_dump "$DATABASE_URL" --format=custom --schema=public --schema=scm \
            --no-owner --no-privileges --file=prod.dump
          ls -la prod.dump

      - name: Restore into the runner's throwaway Postgres
        run: |
          set -euo pipefail
          psql "$LOCAL/postgres" -v ON_ERROR_STOP=1 -q -c "create database snap"
          psql "$LOCAL/snap" -v ON_ERROR_STOP=1 -q <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema extensions;
          alter database snap set search_path = "$user", public, extensions;
          SQL
          while IFS='|' read -r name nsp; do
            [ -n "$name" ] || continue
            if psql "$LOCAL/snap" -q -c "create schema if not exists \"$nsp\"; create extension if not exists \"$name\" schema \"$nsp\"" 2>/dev/null; then
              echo "extension $name ($nsp): ok"
            else
              echo "extension $name ($nsp): not available on vanilla Postgres, skipped"
            fi
          done < extensions.txt
          pg_restore --no-owner --no-privileges --dbname="$LOCAL/snap" prod.dump 2> restore-errors.log || true
          rm -f prod.dump
          n=$(grep -c "error:" restore-errors.log || true)
          echo "restore error lines: $n"
          grep "error:" restore-errors.log | head -40 || true
          echo "restore error lines: $n" >> "$GITHUB_STEP_SUMMARY"

      - name: Mask customer phone / email
        run: |
          set -euo pipefail
          psql "$LOCAL/snap" -v ON_ERROR_STOP=1 -At <<'SQL'
          -- Append-only audit tables (e.g. scm.pos_sofa_combo_audit) refuse UPDATE
          -- via trigger; this throwaway copy must still be masked, so skip triggers.
          set session_replication_role = replica;
          do $$
          declare r record; n bigint; total bigint := 0;
          begin
            for r in
              select c.table_schema sch, c.table_name tbl, c.column_name col
                from information_schema.columns c
                join information_schema.tables t
                  on t.table_schema = c.table_schema and t.table_name = c.table_name
               where c.table_schema in ('public','scm')
                 and t.table_type = 'BASE TABLE'
                 and c.data_type in ('text','character varying')
                 and (c.column_name ~* 'phone|mobile' or c.column_name ~* 'email')
                 and not (c.column_name ~* 'email' and c.table_name in ('users','members','sales_reps','user_companies','invitations'))
                 and c.column_name !~* '_at$|_status$|_muted$|_required$|_log$|_access$|template|alias'
                 and c.table_name <> '_pg_migrations'
            loop
              execute format(
                'update %I.%I set %I = %L || left(md5(%I), 8) where %I is not null and %I <> %L and %I not like %L',
                r.sch, r.tbl, r.col,
                case when r.col ~* 'email' then 'masked-' else '+60000' end,
                r.col, r.col, r.col, '', r.col,
                case when r.col ~* 'email' then 'masked-%' else '+60000%' end);
              get diagnostics n = row_count;
              total := total + n;
              if n > 0 then raise notice 'masked %.%.%: % rows', r.sch, r.tbl, r.col, n; end if;
            end loop;
            raise notice 'masked total: % values', total;
          end $$;
          SQL

      - name: Row counts of the masked copy
        run: |
          set -euo pipefail
          psql "$LOCAL/snap" -v ON_ERROR_STOP=1 -At -c "
            select t || ': ' || n from (
              select 'public.users' t, count(*) n from public.users union all
              select 'scm.mfg_sales_orders', count(*) from scm.mfg_sales_orders union all
              select 'scm.purchase_orders',  count(*) from scm.purchase_orders  union all
              select 'scm.grns',             count(*) from scm.grns             union all
              select 'scm.delivery_orders',  count(*) from scm.delivery_orders  union all
              select 'scm.sales_invoices',   count(*) from scm.sales_invoices
            ) x;" | tee row-counts.txt
          sed 's/^/- /' row-counts.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Dump the masked copy and encrypt it to the recipient
        run: |
          set -euo pipefail
          pg_dump "$LOCAL/snap" --format=custom --schema=public --schema=scm \
            --no-owner --no-privileges --file=masked.dump
          openssl rand 32 > data.key
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:data.key -in masked.dump -out masked.dump.enc
          openssl pkeyutl -encrypt -pubin -inkey recipient.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in data.key -out data.key.enc
          rm -f data.key masked.dump
          ls -la masked.dump.enc data.key.enc

      - uses: actions/upload-artifact@v4
        with:
          name: local-dev-snapshot
          path: |
            masked.dump.enc
            data.key.enc
            extensions.txt
            restore-errors.log
            row-counts.txt
          retention-days: 1
          if-no-files-found: error
