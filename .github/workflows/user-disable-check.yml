name: User disable blocked check (read-only)

# Answers "why does Disable fail on Team > Members?" without anyone opening a
# SQL console. The evidence lives only in production's scm.staff rows, so the
# alternative was an owner interruption plus the production DSN in front of a
# human for a SELECT. Actions already holds secrets.DATABASE_URL for the
# deploy, so the check runs here and nobody handles the credential.
#
# Manual trigger only -- it is a question, not a gate, and a production DB read
# must never become routine CI noise.
on:
  workflow_dispatch:

# Deliberately NOT in the deploy concurrency group: this touches nothing and
# must never queue behind (or displace) a release.
concurrency:
  group: user-disable-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same environment as the deploy, because that is where DATABASE_URL lives.
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-user-disable-blocked.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub-hosted runners have no IPv6 egress; see deploy-staging.yml
          # for the full Happy-Eyeballs reasoning.
          NODE_OPTIONS: --dns-result-order=ipv4first
