name: Repair the SO link on a sofa purchase line (compartment grain)

# repair-po-so-link-from-book.mjs copies PODTL.FromSODtlKey - the one edge the
# book keys at line grain - but refuses whenever either key resolves to more than
# ONE ERP row. Every sofa is in that bucket by construction: one book line
# becomes one ERP row per compartment. So the whole sofa population is
# unrepairable by that tool, correctly, at the grain it works at.
#
# This asks the narrower question: inside ONE pair of book lines, does every item
# code appear exactly once on each side? Where it does, each purchase compartment
# has exactly one sales compartment of the same product to be, and writing it is
# the book's own edge plus an exact identity match. Where it does not, it stays
# refused - a purchase side holding a compartment the sales side does not is a
# BUILD disagreement and needs the drawing, not a script.
#
# WHY IT MATTERS: a company-1 sofa sales line reads READY only through its own
# dedicated purchase line, so an unlinked one can never light up and MRP will ask
# purchasing to raise a SECOND purchase order for goods already on the way.
#
# PLAN by default. The apply path needs the CONFIRM phrase and this workflow
# PASSES it - a sibling workflow was written that never did (docs/bugs/0700).
#
# A LINK MOVES READINESS AND THIS DOES NOT RECOMPUTE IT (docs/bugs/0675).
# Dispatch "Recompute SO stock allocation" afterwards.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (read-only, default) or apply (writes)"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]
      confirm:
        description: 'For apply, type exactly: I HAVE REVIEWED THE DRY-RUN'
        required: false
        default: ""
        type: string
      company_id:
        description: "ERP company (AED_HOUZS is company 1)"
        required: false
        default: "1"
        type: string
      max_snapshot_age_days:
        description: "Refuse if the AutoCount snapshot is older than this many days"
        required: false
        default: "2"
        type: string

concurrency:
  group: repair-po-so-link-sofa-compartments
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/repair-po-so-link-sofa-compartments.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          COMPANY_ID: ${{ inputs.company_id }}
          MAX_SNAPSHOT_AGE_DAYS: ${{ inputs.max_snapshot_age_days }}
          NODE_OPTIONS: --dns-result-order=ipv4first
