<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The app ships its own light AND dark theme (lib/theme.ts, chosen per
         browser from the account menu). The script sets <html data-theme>
         before first paint so a dark-mode user never sees a white flash;
         lib/theme.ts keeps it in sync after that. `darkreader-lock` stays:
         browser auto-darkening on top of our own theme inverts it into
         unreadable washed-out pills (owner report 2026-09-17). -->
    <meta name="color-scheme" content="light" />
    <script>
      (function () {
        try {
          var p = localStorage.getItem("houzs.theme");
          var dark = p === "dark" || (p === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="color-scheme"]').setAttribute("content", "dark");
        } catch (e) {}
      })();
    </script>
    <meta name="darkreader-lock" />
    <!-- Browser-tab favicon: black mark on transparent (clean on light tab bars).
         The installed PWA app icon is the clean white HC mark on the brand-dark
         slab (matching the custom install banner) — those come from the web
         manifest (icon-192/512), plus apple-touch-icon for iOS. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#13201c" />
    <meta name="application-name" content="Houzs ERP" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Houzs ERP" />

    <!-- The brand web fonts, self-hosted — no external font origin on first
         paint. Two sheets, split 2026-11-09 so first paint stops waiting on
         the Chinese faces:

         /fonts/fonts-v3.css (linked here, render-blocking, ~30 KB): IBM Plex
         Sans 400-800, IBM Plex Serif 400-700, IBM Plex Mono 400-600, Caveat
         400/600, Archivo 500-700.

         /fonts/fonts-cjk-v1.css (~940 KB, NOT linked here): Noto Sans SC and
         Noto Serif SC with Google's unicode-range slicing intact, so a browser
         still downloads only the CJK range chunks a page renders. It is
         attached after the load event by src/lib/deferredFonts.ts — a
         script-inserted stylesheet never blocks rendering. It was 97% of the
         old single fonts-v2.css. Chinese text paints in the system CJK font
         first and swaps when the sheet lands (font-display: swap). It is not
         an inline onload= swap because the CSP (functions/_middleware.ts) is
         script-src 'self', no inline handlers.

         Files live in public/fonts/ and are cached immutable for a year
         (public/_headers), the stylesheets included: any change to the font
         set must ship under NEW file names and repoint this link (or
         deferredFonts.ts) — an in-place edit will not reach returning
         browsers. fonts.css -> fonts-v2.css (2026-08-01, the 800 face) ->
         fonts-v3.css + fonts-cjk-v1.css (2026-11-09) is that rule being
         obeyed. fonts-v2.css stays in the tree for tabs still open on an
         older build. Next change: fonts-v4.css / fonts-cjk-v2.css.

         Declared here rather than @import'ed in src/index.css for the same
         reason the external link was: a <link> starts fetching during HTML
         parse, while an `@import` cannot start until the importing stylesheet
         has been fetched and parsed — and would silently no-op anyway once
         the bundler concatenates index.css behind another sheet.

         Keep this in sync with tailwind.config.js fontFamily and the
         --font-script / --font-mark tokens in src/vendor/design-system/
         tokens.css, which is what Caveat and Archivo are here for. -->
    <link rel="stylesheet" href="/fonts/fonts-v3.css" />
    <title>Houzs Century ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
