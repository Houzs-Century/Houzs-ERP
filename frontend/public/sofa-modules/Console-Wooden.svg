<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <title>2990s Sofa Module — Console Wooden — Fabric console with an opening wooden lid</title>
  <desc>Top view, back of the sofa at the top. Fabric-wrapped body with a WOODEN TOP; the front part of the top is a hinged lid that opens to a storage box (hinges at the back edge of the lid, finger notch at the front). 2 cup holders sit in the wooden top at the BACK (the default; cup holders at the front need a Special Remark).</desc>
  <g transform="translate(20,20)">
    <!-- Fabric-wrapped body, seen as a border around the wooden top -->
    <rect x="0" y="0" width="60" height="160" rx="6" fill="#B89972" stroke="#2C2C2A" stroke-width="1.4"/>
    <!-- Wooden top -->
    <rect x="4" y="4" width="52" height="152" rx="3" fill="#A87B4F" stroke="#2C2C2A" stroke-width="1"/>
    <!-- Fixed back panel carrying the cup holders -->
    <line x1="4" y1="40" x2="56" y2="40" stroke="#2C2C2A" stroke-width="0.8"/>
    <circle cx="20" cy="22" r="6" fill="#5E4329" stroke="#2C2C2A" stroke-width="0.9"/>
    <circle cx="20" cy="22" r="3.6" fill="none" stroke="#3E2C1B" stroke-width="0.5"/>
    <circle cx="40" cy="22" r="6" fill="#5E4329" stroke="#2C2C2A" stroke-width="0.9"/>
    <circle cx="40" cy="22" r="3.6" fill="none" stroke="#3E2C1B" stroke-width="0.5"/>
    <!-- Opening lid -->
    <rect x="8" y="45" width="44" height="106" rx="2" fill="#C29567" stroke="#2C2C2A" stroke-width="0.9"/>
    <!-- Wood grain on the lid -->
    <path d="M16 49 C 14 75, 18 100, 15 147" fill="none" stroke="#9C7148" stroke-width="0.45"/>
    <path d="M25 49 C 27 72, 23 104, 26 147" fill="none" stroke="#9C7148" stroke-width="0.45"/>
    <path d="M35 49 C 33 80, 37 110, 34 147" fill="none" stroke="#9C7148" stroke-width="0.45"/>
    <path d="M44 49 C 46 70, 42 98, 45 147" fill="none" stroke="#9C7148" stroke-width="0.45"/>
    <!-- Hinges at the back edge of the lid -->
    <rect x="14" y="43.6" width="8" height="2.8" rx="0.6" fill="#8A8A86" stroke="#2C2C2A" stroke-width="0.5"/>
    <rect x="38" y="43.6" width="8" height="2.8" rx="0.6" fill="#8A8A86" stroke="#2C2C2A" stroke-width="0.5"/>
    <!-- Finger notch at the front of the lid -->
    <path d="M24 151 Q 30 143 36 151 Z" fill="#7A5634" stroke="#2C2C2A" stroke-width="0.6"/>
  </g>
</svg>
