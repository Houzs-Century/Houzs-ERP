\* THE REAL CODE WITH EVERY FAULT IT CAN MEET: a Worker killed between the
\* host's Save() and mark(), an answer lost after Save(), and a live send
\* older than the lease. Expected: NoDoublePost VIOLATED. This is a FINDING,
\* pinned here with --expect-violation so a fix shows up as a change.
SPECIFICATION Spec
CONSTANTS
    Dispatchers = {"sweep", "sendNow"}
    Rows = {"r1", "r2"}
    MaxAttempts = 6
    MaxCrashes = 2
    CrashAfterSave = TRUE
    ResponseCanBeLost = TRUE
    LeaseCanExpireOnLiveSend = TRUE
    ClaimIgnoresHolder = FALSE
INVARIANTS
    TypeOK
    NoDoublePost
PROPERTIES
    EventuallyDone
