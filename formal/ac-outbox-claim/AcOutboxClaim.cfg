\* The real code under the assumptions its own comments make
\* (autocount-claim.ts:25-38): a live send never outlasts the 10-minute lease,
\* and a Worker that dies, dies before the host saves. Expected: PASS.
\* The faults those assumptions exclude are in AcOutboxClaimFinding.cfg.
SPECIFICATION Spec
CONSTANTS
    Dispatchers = {"sweep", "sendNow"}
    Rows = {"r1", "r2"}
    MaxAttempts = 6
    MaxCrashes = 2
    CrashAfterSave = FALSE
    ResponseCanBeLost = FALSE
    LeaseCanExpireOnLiveSend = FALSE
    ClaimIgnoresHolder = FALSE
INVARIANTS
    TypeOK
    NoDoublePost
PROPERTIES
    EventuallyDone
